<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pelagia — The Ocean Line</title>
<meta name="description" content="A miniature tropical island diorama with a vintage railway that runs above and below the sea.">
<style>
  :root {
    --ink: #1c2a38; --ink-soft: rgba(28, 42, 56, 0.62); --glass: rgba(251, 248, 241, 0.74);
    --glass-edge: rgba(255, 255, 255, 0.7); --accent: #b8493a; --accent-soft: rgba(184, 73, 58, 0.12);
    --sea: #1f6f83; --shadow: 0 10px 34px rgba(20, 40, 60, 0.18);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "DejaVu Serif", serif;
    --sans: "Avenir Next", "Segoe UI", "Helvetica Neue", Roboto, "DejaVu Sans", system-ui, sans-serif;
  }
  body.night {
    --ink: #eef2f7; --ink-soft: rgba(230, 238, 247, 0.62); --glass: rgba(18, 28, 46, 0.66);
    --glass-edge: rgba(160, 190, 230, 0.22); --accent: #f0b35e; --accent-soft: rgba(240, 179, 94, 0.16);
    --shadow: 0 10px 34px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9ec; font-family: var(--sans); color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .ui { transition: opacity 0.45s ease, transform 0.45s ease; }
  body.ui-hidden .ui { opacity: 0; pointer-events: none; }
  body.ui-hidden #panel { transform: translate(-50%, 16px); }
  body.ui-hidden #route { transform: translateY(-12px); }

  #title { position: fixed; top: 22px; left: 26px; pointer-events: none; user-select: none; }
  #title .eyebrow { font: 600 10.5px/1 var(--sans); letter-spacing: 0.26em; text-transform: uppercase; color: var(--ink-soft); }
  #title h1 { margin: 8px 0 0; font: 400 38px/1 var(--serif); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); }
  #title .sub { margin-top: 5px; font: italic 400 19px/1.1 var(--serif); letter-spacing: 0.04em; color: var(--ink); opacity: 0.86; }
  #title .rule { width: 44px; height: 1px; background: var(--accent); margin: 10px 0 0; opacity: 0.8; }
  body:not(.night) #title h1, body:not(.night) #title .sub { text-shadow: 0 1px 12px rgba(255, 255, 255, 0.55); }
  body.night #title h1, body.night #title .sub { text-shadow: 0 1px 14px rgba(0, 0, 0, 0.55); }

  .glass { background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(14px) saturate(1.15); backdrop-filter: blur(14px) saturate(1.15); }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #topRight { position: fixed; top: 18px; right: 20px; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 999px; }
  .icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; transition: background 0.2s; }
  .icon:hover { background: var(--accent-soft); }
  .icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  #vol { width: 92px; }
  body.muted #vol { opacity: 0.4; }

  input[type=range] { -webkit-appearance: none; appearance: none; height: 22px; background: transparent; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(128, 140, 150, 0.35) var(--fill, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; margin-top: -6px; border-radius: 50%; background: #fffdf8; border: 1.5px solid var(--accent); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 3px; background: rgba(128, 140, 150, 0.35); }
  input[type=range]::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: #fffdf8; border: 1.5px solid var(--accent); }

  #panel { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 0; padding: 8px; border-radius: 18px; max-width: calc(100vw - 24px); }
  .group { display: flex; flex-direction: column; gap: 5px; padding: 4px 12px 6px; }
  .group + .group { border-left: 1px solid rgba(128, 140, 150, 0.22); }
  .glabel { font: 600 9.5px/1 var(--sans); letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-soft); padding-left: 4px; }
  .seg { display: flex; gap: 2px; }
  .seg button { padding: 7px 12px; border-radius: 10px; font-size: 13px; letter-spacing: 0.01em; white-space: nowrap; transition: background 0.2s, color 0.2s; }
  .seg button:hover { background: var(--accent-soft); }
  .seg button.on { background: var(--accent); color: #fffaf2; }
  body.night .seg button.on { color: #1b2233; }
  .trainCtl { display: flex; align-items: center; gap: 8px; }
  #speed { width: 110px; }
  #speedVal { font-size: 12px; min-width: 34px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
  #btnWhistle { padding: 7px 12px; border-radius: 10px; font-size: 13px; border: 1px solid rgba(128, 140, 150, 0.35); display: flex; align-items: center; gap: 6px; }
  #btnWhistle:hover { background: var(--accent-soft); }
  #btnWhistle.blow { background: var(--accent); color: #fffaf2; border-color: transparent; }
  #btnWhistle svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; }

  #route { position: fixed; right: 20px; top: 72px; width: 246px; padding: 9px 12px 11px; border-radius: 16px; }
  #route svg { width: 100%; height: auto; display: block; }
  #route .rp-track { fill: none; stroke: rgba(120, 132, 142, 0.55); stroke-width: 2.2; stroke-linecap: round; }
  #route .rp-done { fill: none; stroke: var(--accent); stroke-width: 2.6; stroke-linecap: round; }
  #route .rp-tube { fill: none; stroke: #3aa7c0; stroke-width: 5; stroke-linecap: round; opacity: 0.35; }
  #route .rp-coast { fill: rgba(150, 175, 120, 0.28); stroke: none; }
  #route .rp-station { fill: var(--ink); }
  #route .rp-dot { fill: var(--accent); stroke: #fff; stroke-width: 1.4; }
  #routeLabel { margin-top: 6px; font: italic 400 14.5px/1.25 var(--serif); }
  .rp-row { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
  #routeMeta { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
  #routeMeta.paused { color: var(--accent); font-weight: 600; }
  .rp-bar { position: relative; flex: 1 1 auto; height: 3px; border-radius: 3px; background: rgba(128, 140, 150, 0.3); overflow: hidden; }
  .rp-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  .rp-bar b { position: absolute; top: 0; bottom: 0; background: rgba(58, 167, 192, 0.55); }

  #btnShow { position: fixed; right: 18px; bottom: 18px; padding: 8px 14px; border-radius: 999px; font-size: 12px; letter-spacing: 0.06em; opacity: 0; pointer-events: none; transition: opacity 0.4s; }
  body.ui-hidden #btnShow { opacity: 0.85; pointer-events: auto; }
  #hint { position: fixed; left: 27px; top: 136px; font-size: 11px; letter-spacing: 0.03em; color: var(--ink-soft); pointer-events: none; line-height: 1.6; transition: opacity 1.2s; }
  #hint.fade { opacity: 0; }
  #soundHint { position: fixed; top: 31px; right: 212px; font-size: 11px; color: var(--ink-soft); pointer-events: none; transition: opacity 0.6s; white-space: nowrap; }
  body.audio-on #soundHint { opacity: 0; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; background: #e6eef0; font: italic 400 20px var(--serif); color: #33495a; transition: opacity 0.8s; z-index: 10; }
  #loader.done { opacity: 0; pointer-events: none; }

  @media (max-width: 1080px) { #hint { display: none; } }
  @media (max-width: 1180px) and (min-width: 861px) { .seg button { padding: 7px 9px; font-size: 12.5px; } #speed { width: 90px; } }
  @media (max-width: 860px) {
    #title { top: 14px; left: 16px; }
    #title h1 { font-size: 27px; }
    #title .sub { font-size: 15px; }
    #title .eyebrow { font-size: 9px; letter-spacing: 0.2em; }
    #panel { flex-wrap: wrap; justify-content: center; bottom: 10px; padding: 6px; border-radius: 16px; width: calc(100vw - 16px); }
    .group { padding: 4px 6px 5px; }
    .group + .group { border-left: 0; }
    .seg button { padding: 7px 9px; font-size: 12px; }
    #speed { width: 84px; }
    #route { right: 8px; top: 58px; width: 232px; padding: 7px 10px 8px; }
    #route svg { display: none; }
    #routeLabel { font-size: 13px; }
    #topRight { top: 10px; right: 10px; padding: 4px 6px; }
    #vol { width: 64px; }
    #soundHint { display: none; }
  }
  @media (max-width: 480px) {
    .glabel { display: none; }
    #route { top: 56px; width: calc(100vw - 178px); max-width: 232px; }
    #routeLabel { font-size: 12.5px; }
    #title h1 { font-size: 23px; }
    #title .eyebrow { display: none; }
  }
  @media (max-height: 520px) { #route svg { display: none; } #hint { display: none; } }
</style>
</head>
<body>
<div id="loader">Building the island&hellip;</div>
<header id="title" class="ui">
  <div class="eyebrow">A miniature railway above &amp; below the sea</div>
  <h1>Pelagia</h1>
  <div class="sub">The Ocean Line</div>
  <div class="rule"></div>

  </button>
  <input id="vol" type="range" min="0" max="100" value="55" aria-label="Volume" title="Volume">
  <button id="btnHide" class="icon" title="Hide controls (H)" aria-label="Hide controls">
    <svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
  </button>
</div>
<div id="soundHint" class="ui">Click anywhere to start the sound</div>

<section id="route" class="ui glass" aria-label="Route progress">
  <svg id="routeSvg" viewBox="0 0 240 150" aria-hidden="true"></svg>
  <div id="routeLabel">Pelagia Station</div>
  <div class="rp-row"><div class="rp-bar" id="routeBarWrap"><i id="routeBar"></i></div><span id="routeMeta">0% &middot; lap 1</span></div>
</section>

<nav id="panel" class="ui glass" aria-label="Controls">
  <div class="group">
    <span class="glabel">View</span>
    <div class="seg" id="camSeg">
      <button data-cam="island" class="on" title="Island overview (1)">Island</button>
      <button data-cam="follow" title="Follow the train (2)">Follow</button>
      <button data-cam="onboard" title="Ride on board (3)">On Board</button>
      <button data-cam="reef" title="Underwater reef view (4)">Reef</button>
    </div>
  </div>
  <div class="group">
    <span class="glabel">Light</span>
    <div class="seg" id="lightSeg">
      <button data-light="day" class="on" title="Daylight (L cycles)">Daylight</button>
      <button data-light="golden" title="Golden hour">Golden Hour</button>
      <button data-light="night" title="Moonlight">Moonlight</button>
    </div>
  </div>
  <div class="group">
    <span class="glabel">Train</span>
    <div class="trainCtl">
      <button id="btnPlay" class="icon" title="Play / pause (Space)" aria-label="Play or pause">
        <svg viewBox="0 0 24 24"><g class="pause"><path d="M8.5 5.5v13M15.5 5.5v13"/></g><g class="play" style="display:none"><path d="M7.5 5.5l11 6.5-11 6.5z"/></g></svg>
      </button>
      <input id="speed" type="range" min="0" max="100" value="45" aria-label="Train speed" title="Train speed">
      <span id="speedVal">1.0&times;</span>
      <button id="btnWhistle" title="Blow the whistle (W)">
        <svg viewBox="0 0 24 24"><path d="M4 14h9l3-3h4v6h-4l-3-3"/><path d="M8 10c0-2 1-3 3-3M11 10c0-1.4.7-2 2-2"/></svg>Whistle
      </button>
    </div>
  </div>
</nav>
<button id="btnShow" class="ui-show glass">Show controls</button>
<div id="hint" class="ui">Drag to orbit &middot; scroll or pinch to zoom<br>Keys 1&ndash;4 views &middot; Space pause &middot; W whistle &middot; H hide</div>

<script type="module">

// ---- 00_imports.js ----
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---- 10_world.js ----
// ============================================================================
// WORLD LAYOUT — coastline, terrain height field, railway route, obstacles
// (pure math: shared by the renderer and by the offline layout checks)
// ============================================================================
const EA = 38, EB = 29;            // diorama ellipse semi-axes (x, z)
const BASE_Y = -11;                // bottom of the solid terrain volume
const GAUGE = 0.44;                // rail centre spacing
const BED_DROP = 0.27;             // rail top -> ground under the ballast
const TUBE = { cy: 0.44, ri: 0.80, ro: 0.86, rib: 0.95, collar: 1.32, collarLen: 0.9 };
const PORTAL_RAIL = 0.45, STATION_RAIL = 0.82, VIADUCT_RAIL = 1.0, VIADUCT_RAIL_E = 0.74, TUBE_LOW_RAIL = -2.2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const gauss = (x, z, cx, cz, rx, rz) => Math.exp(-(((x - cx) / rx) ** 2 + ((z - cz) / rz) ** 2));

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const PERM = new Uint8Array(512);
(() => {
  const p = Array.from({ length: 256 }, (_, i) => i), r = mulberry32(1709);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function grad2(h, x, y) {
  switch (h & 7) {
    case 0: return x + y; case 1: return x - y; case 2: return -x + y; case 3: return -x - y;
    case 4: return x; case 5: return -x; case 6: return y; default: return -y;
  }
}
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const X = xi & 255, Y = yi & 255;
  const u = xf * xf * xf * (xf * (xf * 6 - 15) + 10), v = yf * yf * yf * (yf * (yf * 6 - 15) + 10);
  const aa = PERM[PERM[X] + Y], ab = PERM[PERM[X] + Y + 1], ba = PERM[PERM[X + 1] + Y], bb = PERM[PERM[X + 1] + Y + 1];
  const x1 = lerp(grad2(aa, xf, yf), grad2(ba, xf - 1, yf), u);
  const x2 = lerp(grad2(ab, xf, yf - 1), grad2(bb, xf - 1, yf - 1), u);
  return lerp(x1, x2, v) * 0.72;
}
function fbm2(x, y, oct = 4) {
  let a = 0.5, f = 1, s = 0;
  for (let i = 0; i < oct; i++) { s += a * noise2(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}
// normalised elliptical radius of the diorama (1 = outer boundary)
const ellR = (x, z) => Math.sqrt((x / EA) ** 2 + (z / EB) ** 2);

// ---------------------------------------------------------------------------
// Coastline (closed spline, extends past the ellipse where the land is cut)
// ---------------------------------------------------------------------------
const COAST_PTS = [
  [-44, 14], [-33.8, 13.6], [-29.5, 12.6], [-27.2, 11.2], [-25.2, 9.4], [-22.6, 7.2],
  [-18, 5.7], [-10, 5.35], [-2, 5.5], [5, 5.15], [9.2, 4.3], [11.2, 2.4], [12.0, -0.8],
  [13.6, -4.2], [16.2, -5.6], [18.8, -4.4], [20.2, -1.2], [21.4, 2.6], [24.4, 5.4],
  [28.2, 7.2], [32.2, 7.6], [34.6, 5.2], [35.0, 0.5], [34.0, -5.5], [31.2, -10.4],
  [26.2, -13.2], [19.5, -13.4], [12.5, -15.2], [5, -17.6], [-3, -19.5], [-11, -21.2],
  [-18, -22.4], [-24, -21.6], [-30, -24], [-44, -12],
];
const coastCurve = new THREE.CatmullRomCurve3(COAST_PTS.map(p => new THREE.Vector3(p[0], 0, p[1])), true, 'centripetal');
coastCurve.arcLengthDivisions = 4000;
const COAST_N = 720;
const coastX = new Float64Array(COAST_N), coastZ = new Float64Array(COAST_N);
coastCurve.getSpacedPoints(COAST_N).slice(0, COAST_N).forEach((p, i) => { coastX[i] = p.x; coastZ[i] = p.z; });

function coastSDExact(x, z) {
  let best = 1e18, inside = false;
  for (let i = 0, j = COAST_N - 1; i < COAST_N; j = i++) {
    const xi = coastX[i], zi = coastZ[i], xj = coastX[j], zj = coastZ[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) inside = !inside;
    const dx = xj - xi, dz = zj - zi;
    let t = ((x - xi) * dx + (z - zi) * dz) / (dx * dx + dz * dz);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const ex = xi + t * dx - x, ez = zi + t * dz - z, d2 = ex * ex + ez * ez;
    if (d2 < best) best = d2;
  }
  return inside ? Math.sqrt(best) : -Math.sqrt(best);
}

// ---------------------------------------------------------------------------
// Railway route: horizontal spline + smooth height profile, arc-length tables
// ---------------------------------------------------------------------------
const arcPts = (cx, cz, r, a0, a1, n) => Array.from({ length: n }, (_, i) => {
  const a = (a0 + (a1 - a0) * i / (n - 1)) * Math.PI / 180;
  return [cx + r * Math.cos(a), cz + r * Math.sin(a)];
});
const ROUTE_PTS = [
  [-20, 2.2], [-14, 2.2], [-8, 2.2], [-2, 2.2], [4, 2.35], [9.5, 2.1],
  [13.5, 1.75], [18, 1.5],
  ...arcPts(23.5, 8.0, 6.5, -90, 0, 5), [30.1, 10.6], [29.3, 13.4],
  [27, 16.1], [22.5, 18.9], [15.5, 21.2], [6.5, 22.4], [-3, 22.4], [-11.5, 21.0], [-18.2, 18.2],
  [-23.0, 14.6], [-25.8, 11.3], ...arcPts(-20, 8.6, 6.4, 180, 247.5, 4),
];
const routeCurve2 = new THREE.CatmullRomCurve3(ROUTE_PTS.map(p => new THREE.Vector3(p[0], 0, p[1])), true, 'centripetal');
routeCurve2.arcLengthDivisions = 8000;

const ROUTE = (() => {
  const LH = routeCurve2.getLength();
  const NU = Math.round(LH / 0.05);
  const pts = routeCurve2.getSpacedPoints(NU);             // NU+1 points, last == first
  const du = LH / NU;
  const ux = new Float64Array(NU + 1), uz = new Float64Array(NU + 1);
  for (let i = 0; i <= NU; i++) { ux[i] = pts[i].x; uz[i] = pts[i].z; }
  const nearestU = (x, z) => {
    let b = 1e18, bi = 0;
    for (let i = 0; i < NU; i++) { const d = (ux[i] - x) ** 2 + (uz[i] - z) ** 2; if (d < b) { b = d; bi = i; } }
    return bi * du;
  };
  // anchors along the horizontal arc length
  const uStop = nearestU(-4.2, 2.2);                        // loco front stops here
  const uStationA = nearestU(-16.5, 2.2), uStationB = nearestU(-1.0, 2.2);
  // viaduct: where the route leaves / rejoins land around the bay
  let uV0 = 0, uV1 = 0;
  { let inWater = false;
    for (let i = 0; i < NU && !uV1; i++) {
      if (ux[i] < 9 || ux[i] > 23 || uz[i] > 4) continue;
      const w = coastSDExact(ux[i], uz[i]) < 0.6;
      if (w && !inWater) { uV0 = i * du; inWater = true; }
      if (!w && inWater) { uV1 = i * du; inWater = false; }
    } }
  uV0 -= 1.2; uV1 += 1.2;                                   // abutments on land
  const uPE = nearestU(23.5 + 6.5 * Math.cos(-0.61), 8.0 + 6.5 * Math.sin(-0.61));
  const uPW = nearestU(-20 + 6.4 * Math.cos(3.578), 8.6 + 6.4 * Math.sin(3.578));
  const uLow = (uPE + uPW) / 2;
  const keys = [
    [uStationA, STATION_RAIL], [uStationB, STATION_RAIL],
    [uV0 - 0.5, VIADUCT_RAIL], [uV1, VIADUCT_RAIL_E],
    [uPE, PORTAL_RAIL], [uLow - 1.2, TUBE_LOW_RAIL], [uLow + 1.2, TUBE_LOW_RAIL],
    [uPW, PORTAL_RAIL], [uStationA + LH, STATION_RAIL],
  ];
  // smooth ramps: grade follows a smoothstep-edged trapezoid inside each key interval
  const y = new Float64Array(NU + 1);
  for (let k = 0; k < keys.length - 1; k++) {
    const [ua, ya] = keys[k], [ub, yb] = keys[k + 1];
    const len = ub - ua, T = Math.min(5.5, len * 0.4);
    const i0 = Math.ceil(ua / du), i1 = Math.floor(ub / du);
    const n = i1 - i0 + 1, W = new Float64Array(n + 1);
    for (let j = 0; j < n; j++) {
      const x = (i0 + j) * du - ua;
      W[j + 1] = W[j] + smoothstep(0, T, x) * smoothstep(0, T, len - x) * du;
    }
    const tot = W[n] || 1;
    for (let j = 0; j < n; j++) {
      const idx = ((i0 + j) % NU + NU) % NU;
      y[idx] = ya + (yb - ya) * (W[j] / tot);
    }
  }
  y[NU] = y[0];
  // 3-D arc length and uniform resampling
  const s3 = new Float64Array(NU + 1);
  for (let i = 1; i <= NU; i++) s3[i] = s3[i - 1] + Math.hypot(ux[i] - ux[i - 1], y[i] - y[i - 1], uz[i] - uz[i - 1]);
  const L = s3[NU], DS = 0.05, NS = Math.round(L / DS), ds = L / NS;
  const PX = new Float32Array(NS + 1), PY = new Float32Array(NS + 1), PZ = new Float32Array(NS + 1);
  const U2S = (u) => { const f = u / du, i = Math.min(NU - 1, Math.floor(f)); return lerp(s3[i], s3[i + 1], f - i); };
  for (let j = 0, i = 0; j <= NS; j++) {
    const s = j * ds;
    while (i < NU - 1 && s3[i + 1] < s) i++;
    const t = (s - s3[i]) / (s3[i + 1] - s3[i]);
    PX[j] = lerp(ux[i], ux[i + 1], t); PY[j] = lerp(y[i], y[i + 1], t); PZ[j] = lerp(uz[i], uz[i + 1], t);
  }
  const TX = new Float32Array(NS + 1), TY = new Float32Array(NS + 1), TZ = new Float32Array(NS + 1);
  for (let j = 0; j <= NS; j++) {
    const a = (j - 2 + NS) % NS, b = (j + 2) % NS;
    const dx = PX[b] - PX[a], dy = PY[b] - PY[a], dz = PZ[b] - PZ[a], l = Math.hypot(dx, dy, dz);
    TX[j] = dx / l; TY[j] = dy / l; TZ[j] = dz / l;
  }
  const sOf = (u) => U2S(((u % LH) + LH) % LH);
  return {
    L, NS, ds, PX, PY, PZ, TX, TY, TZ, LH,
    sStop: sOf(uStop), sStationA: sOf(uStationA), sStationB: sOf(uStationB),
    sV0: sOf(uV0), sV1: sOf(uV1), sPE: sOf(uPE), sPW: sOf(uPW), sLow: sOf(uLow),
    keys: keys.map(k => [sOf(k[0]), k[1]]),
  };
})();

const wrapS = (s) => ((s % ROUTE.L) + ROUTE.L) % ROUTE.L;
// position / frame on the track (rail-top centre line)
function routeSample(s, P, T) {
  s = wrapS(s);
  const f = s / ROUTE.ds, i = Math.min(ROUTE.NS - 1, Math.floor(f)), t = f - i;
  if (P) P.set(lerp(ROUTE.PX[i], ROUTE.PX[i + 1], t), lerp(ROUTE.PY[i], ROUTE.PY[i + 1], t), lerp(ROUTE.PZ[i], ROUTE.PZ[i + 1], t));
  if (T) T.set(lerp(ROUTE.TX[i], ROUTE.TX[i + 1], t), lerp(ROUTE.TY[i], ROUTE.TY[i + 1], t), lerp(ROUTE.TZ[i], ROUTE.TZ[i + 1], t)).normalize();
}
const _UPW = new THREE.Vector3(0, 1, 0);
// right = T x up (horizontal), up' = right x T
function routeFrame(s, P, T, Rt, Up) {
  routeSample(s, P, T);
  Rt.crossVectors(T, _UPW).normalize();
  Up.crossVectors(Rt, T).normalize();
}
const inTube = (s) => { s = wrapS(s); return s >= ROUTE.sPE && s <= ROUTE.sPW; };
const onViaduct = (s) => { s = wrapS(s); return s >= ROUTE.sV0 && s <= ROUTE.sV1; };
function routeSection(s) {
  s = wrapS(s);
  if (s >= ROUTE.sStationA && s <= ROUTE.sStationB) return 'station';
  if (s < ROUTE.sV0) return 'shore';
  if (s <= ROUTE.sV1) return 'viaduct';
  if (s < ROUTE.sPE) return 'headland';
  if (s <= ROUTE.sPW) {
    const t = (s - ROUTE.sPE) / (ROUTE.sPW - ROUTE.sPE);
    return t < 0.36 ? 'descent' : t > 0.64 ? 'ascent' : 'reef';
  }
  return 'approach';
}

// ---------------------------------------------------------------------------
// Placement data (buildings / pads) — used both for terrain shaping and models
// ---------------------------------------------------------------------------
const STATION = { x0: -15.2, x1: -2.4, zTrack: 2.2, platformBack: -0.35, bldX: -9.2, bldW: 4.6, bldD: 2.2 };
const LIGHTHOUSE = { x: -31.2, z: 6.2 };
const CHAPEL = { x: -3.2, z: -9.4, rot: 0.12 };
const COTTAGES = [
  // x, z, width, depth, rotation, storeys, colour variant
  [-18.2, -3.2, 2.0, 1.6, 0.10, 1, 0], [-14.6, -4.4, 1.8, 1.5, -0.08, 2, 1], [-4.2, -3.6, 1.9, 1.5, 0.05, 1, 2],
  [0.4, -4.4, 1.7, 1.5, -0.14, 2, 0], [4.4, -2.6, 1.8, 1.4, 0.2, 1, 1], [-11.2, -7.6, 2.1, 1.6, 0.04, 2, 2],
  [-20.8, -8.0, 1.9, 1.5, 0.28, 1, 0], [-7.4, -12.2, 1.8, 1.5, -0.1, 1, 1], [2.6, -11.6, 2.0, 1.6, 0.16, 2, 0],
  [8.2, -8.4, 1.8, 1.4, -0.3, 1, 2], [-16.6, -13.6, 1.8, 1.5, 0.22, 1, 1], [24.4, -2.4, 1.9, 1.5, -0.4, 1, 0],
  [27.6, -7.4, 1.7, 1.4, 0.3, 2, 2],
];
const PORTALS = [];   // filled once the route frames are known (east, west)
const PADS = [];      // {x, z, rx, rz, rot, h, blend}
(() => {
  const P = new THREE.Vector3(), T = new THREE.Vector3();
  for (const s of [ROUTE.sPE, ROUTE.sPW]) {
    routeSample(s, P, T);
    PORTALS.push({ s, x: P.x, y: P.y, z: P.z, heading: Math.atan2(T.x, T.z) });
  }
})();

// ---------------------------------------------------------------------------
// Height field grid
// ---------------------------------------------------------------------------
const HG = { x0: -EA - 1.5, z0: -EB - 1.5, step: 0.25 };
HG.nx = Math.ceil((2 * EA + 3) / HG.step) + 1;
HG.nz = Math.ceil((2 * EB + 3) / HG.step) + 1;
HG.h = new Float32Array(HG.nx * HG.nz);
HG.d = new Float32Array(HG.nx * HG.nz);     // coast signed distance
HG.kind = new Uint8Array(HG.nx * HG.nz);    // 1 track bed, 2 tube trench, 3 pad

const REEF_MOUNDS = [
  // x, z, radius, height above the lagoon floor
  [24.5, 12.6, 2.4, 2.0], [19.5, 16.2, 2.0, 1.6], [9.5, 17.6, 2.6, 1.9], [0.5, 18.4, 2.2, 1.7],
  [-8.5, 17.4, 2.4, 1.9], [-16.5, 14.6, 2.0, 1.5], [13.5, 25.0, 1.6, 1.3], [-6, 25.4, 1.8, 1.4],
  [4.5, 25.6, 1.5, 1.2], [-15.5, 23.8, 1.5, 1.3], [26.5, 21.0, 1.4, 1.1], [33.2, 12.8, 1.6, 1.4],
  [6.5, 10.2, 1.7, 1.2], [-4.5, 11.0, 1.5, 1.0], [15.5, 9.5, 1.6, 1.2],
];
// each mound is a cluster of uneven lobes so the reef does not read as round domes
const REEF_LOBES = (() => {
  const r = mulberry32(4411), out = [];
  for (const m of REEF_MOUNDS) {
    const n = 3 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) {
      const a = r() * Math.PI * 2, d = m[2] * (k === 0 ? 0 : 0.35 + r() * 0.45);
      out.push([m[0] + Math.cos(a) * d, m[1] + Math.sin(a) * d, m[2] * (0.45 + r() * 0.35), m[2] * (0.4 + r() * 0.35),
        m[3] * (k === 0 ? 0.85 : 0.45 + r() * 0.4)]);
    }
  }
  return out;
})();
function reefBumps(x, z) {
  let s = 0;
  for (const l of REEF_LOBES) s = Math.max(s, l[4] * gauss(x, z, l[0], l[1], l[2], l[3]));
  const n = fbm2(x * 0.45, z * 0.45, 3);
  return s > 0.05 ? s * (0.85 + 0.35 * n) + 0.18 * smoothstep(0.2, 0.9, s) * noise2(x * 1.3, z * 1.3) : s;
}
function hillBumps(x, z) {
  return 2.4 * gauss(x, z, -13, -14, 7, 6) + 3.6 * gauss(x, z, -29, -13, 8, 9)
    + 2.5 * gauss(x, z, LIGHTHOUSE.x, LIGHTHOUSE.z, 3.6, 3.4) + 1.4 * gauss(x, z, 28, -5, 5, 5)
    + 1.1 * gauss(x, z, 4, -13, 6, 4) + 0.7 * gauss(x, z, -22, -2, 4, 3);
}
function baseHeight(x, z, d) {
  if (d >= 0) {
    let h = 0.36 * (1 - Math.exp(-d / 1.25)) + 0.7 * smoothstep(1.6, 5.5, d);
    const inland = smoothstep(2.4, 7.0, d);
    h += inland * (0.26 * fbm2(x * 0.085, z * 0.085, 4) + hillBumps(x, z));
    return h;
  }
  const u = -d;
  let h = -(0.29 * u * Math.exp(-u / 3.2)) - 5.9 * smoothstep(2.0, 7.0, u);
  const deep = smoothstep(4, 10, u);
  h += deep * 0.5 * fbm2(x * 0.07 + 11, z * 0.07 - 3, 4);
  h += reefBumps(x, z) * smoothstep(2.5, 6.5, u);
  h -= 1.4 * gauss(x, z, 16.2, -1.2, 3.2, 4.0) * smoothstep(0.4, 2.2, u);   // the bay under the viaduct
  return h;
}

(() => {
  // coarse coast distance, then bilinear refinement
  const cs = 0.5, cnx = Math.ceil((2 * EA + 3) / cs) + 2, cnz = Math.ceil((2 * EB + 3) / cs) + 2;
  const cd = new Float32Array(cnx * cnz);
  for (let j = 0; j < cnz; j++) for (let i = 0; i < cnx; i++) cd[j * cnx + i] = coastSDExact(HG.x0 + i * cs, HG.z0 + j * cs);
  const { nx, nz, step } = HG;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      const x = HG.x0 + i * step, z = HG.z0 + j * step;
      const fx = (x - HG.x0) / cs, fz = (z - HG.z0) / cs;
      const ci = Math.min(cnx - 2, Math.floor(fx)), cj = Math.min(cnz - 2, Math.floor(fz));
      const tx = fx - ci, tz = fz - cj;
      const d = lerp(lerp(cd[cj * cnx + ci], cd[cj * cnx + ci + 1], tx), lerp(cd[(cj + 1) * cnx + ci], cd[(cj + 1) * cnx + ci + 1], tx), tz);
      HG.d[j * nx + i] = d;
      HG.h[j * nx + i] = baseHeight(x, z, d);
    }
  }
})();

// flatten pads for buildings
function addPad(x, z, rx, rz, rot, h, blend = 1.4) { PADS.push({ x, z, rx, rz, rot, h, blend }); }
function sampleGrid(arr, x, z) {
  const fx = clamp((x - HG.x0) / HG.step, 0, HG.nx - 1.001), fz = clamp((z - HG.z0) / HG.step, 0, HG.nz - 1.001);
  const i = Math.floor(fx), j = Math.floor(fz), tx = fx - i, tz = fz - j, n = HG.nx;
  return lerp(lerp(arr[j * n + i], arr[j * n + i + 1], tx), lerp(arr[(j + 1) * n + i], arr[(j + 1) * n + i + 1], tx), tz);
}
function applyPads() {
  const { nx, nz, step } = HG;
  for (const p of PADS) {
    const c = Math.cos(p.rot), sn = Math.sin(p.rot), R = Math.max(p.rx, p.rz) + p.blend + 0.5;
    const i0 = Math.max(0, Math.floor((p.x - R - HG.x0) / step)), i1 = Math.min(nx - 1, Math.ceil((p.x + R - HG.x0) / step));
    const j0 = Math.max(0, Math.floor((p.z - R - HG.z0) / step)), j1 = Math.min(nz - 1, Math.ceil((p.z + R - HG.z0) / step));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const x = HG.x0 + i * step - p.x, z = HG.z0 + j * step - p.z;
      const lx = x * c - z * sn, lz = x * sn + z * c;
      const ex = Math.max(0, Math.abs(lx) - p.rx), ez = Math.max(0, Math.abs(lz) - p.rz);
      const w = 1 - smoothstep(0, p.blend, Math.hypot(ex, ez));
      if (w <= 0) continue;
      const k = j * nx + i;
      HG.h[k] = lerp(HG.h[k], p.h, w);
      if (w > 0.95) HG.kind[k] = 3;
    }
  }
}

// ground heights for pads come from the natural terrain at their centres
(() => {
  const g = (x, z) => sampleGrid(HG.h, x, z);
  // station: platform area flattened to the track bed level
  const stGround = STATION_RAIL - BED_DROP;
  addPad((STATION.x0 + STATION.x1) / 2, 0.2, (STATION.x1 - STATION.x0) / 2 + 1.0, 2.9, 0, stGround, 1.8);
  addPad(LIGHTHOUSE.x, LIGHTHOUSE.z, 1.5, 1.5, 0, g(LIGHTHOUSE.x, LIGHTHOUSE.z), 1.2);
  addPad(CHAPEL.x, CHAPEL.z, 1.7, 2.3, CHAPEL.rot, g(CHAPEL.x, CHAPEL.z), 1.4);
  for (const c of COTTAGES) {
    const h = Math.max(0.55, g(c[0], c[1]));
    c.push(h);        // index 7: ground height
    addPad(c[0], c[1], c[2] / 2 + 0.35, c[3] / 2 + 0.35, c[4], h, 1.3);
  }
  for (const p of PORTALS) addPad(p.x, p.z, 1.6, 1.6, 0, p.y - BED_DROP, 0.9);
  applyPads();
})();

// carve the railway corridor: embankments / cuttings on land, trench under the tube
(() => {
  const { nx, nz, step } = HG;
  const R = 3.6, P = new THREE.Vector3();
  const nearest = (want) => {
    const best = new Float32Array(nx * nz).fill(1e9), bestY = new Float32Array(nx * nz);
    for (let s = 0; s < ROUTE.L; s += 0.15) {
      if (!want(s)) continue;
      routeSample(s, P, null);
      const i0 = Math.max(0, Math.floor((P.x - R - HG.x0) / step)), i1 = Math.min(nx - 1, Math.ceil((P.x + R - HG.x0) / step));
      const j0 = Math.max(0, Math.floor((P.z - R - HG.z0) / step)), j1 = Math.min(nz - 1, Math.ceil((P.z + R - HG.z0) / step));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
        const d = Math.hypot(HG.x0 + i * step - P.x, HG.z0 + j * step - P.z), k = j * nx + i;
        if (d < best[k]) { best[k] = d; bestY[k] = P.y; }
      }
    }
    return [best, bestY];
  };
  const [dl, yl] = nearest(s => !inTube(s) && !onViaduct(s));
  for (let k = 0; k < nx * nz; k++) {
    if (dl[k] > R) continue;
    const w = 1 - smoothstep(0.95, 2.7, dl[k]);
    HG.h[k] = lerp(HG.h[k], yl[k] - BED_DROP, w);
    if (dl[k] < 0.9) HG.kind[k] = 1;
  }
  const [dt, yt] = nearest(s => inTube(s));
  for (let k = 0; k < nx * nz; k++) {
    if (dt[k] > R || dl[k] < dt[k]) continue;
    const bottom = yt[k] + TUBE.cy - TUBE.rib - 0.3;
    const lim = bottom + Math.max(0, dt[k] - (TUBE.rib + 0.25)) * 0.85;
    if (HG.h[k] > lim) { HG.h[k] = lim; HG.kind[k] = 2; }
  }
})();

function terrainH(x, z) { return sampleGrid(HG.h, x, z); }
function coastD(x, z) { return sampleGrid(HG.d, x, z); }
function terrainGrad(x, z) {
  const e = HG.step;
  return [(terrainH(x + e, z) - terrainH(x - e, z)) / (2 * e), (terrainH(x, z + e) - terrainH(x, z - e)) / (2 * e)];
}
// lowest terrain point under a footprint (for sinking props so nothing floats)
function groundMin(x, z, r) {
  let m = terrainH(x, z);
  for (let a = 0; a < 6; a++) m = Math.min(m, terrainH(x + r * Math.cos(a * 1.047), z + r * Math.sin(a * 1.047)));
  return m;
}

// ---------------------------------------------------------------------------
// Underwater obstacles as capsules in a spatial hash (tube, collars, pylons, piers)
// ---------------------------------------------------------------------------
const OBST = { caps: [], cell: 2.0, map: new Map() };
function addCapsule(ax, ay, az, bx, by, bz, r, tag) { OBST.caps.push({ ax, ay, az, bx, by, bz, r, tag }); }
const TUBE_SUPPORTS = [];   // s positions with legs down to the seabed
const VIADUCT_PIERS = [];   // {s, x, z, top}
(() => {
  const P = new THREE.Vector3(), T = new THREE.Vector3(), Rt = new THREE.Vector3(), U = new THREE.Vector3();
  const cen = (s, out) => { routeFrame(s, P, T, Rt, U); return out.copy(P).addScaledVector(U, TUBE.cy); };
  const A = new THREE.Vector3(), B = new THREE.Vector3();
  const s0 = ROUTE.sPE, s1 = ROUTE.sPW, step = 0.5;
  for (let s = s0; s < s1 - 1e-6; s += step) {
    cen(s, A); cen(Math.min(s + step, s1), B);
    addCapsule(A.x, A.y, A.z, B.x, B.y, B.z, TUBE.rib, 'tube');
  }
  // entrance collars (slightly larger rings at both ends)
  for (const [s, dir] of [[s0, 1], [s1, -1]]) {
    cen(s, A); cen(s + dir * TUBE.collarLen, B);
    addCapsule(A.x, A.y, A.z, B.x, B.y, B.z, TUBE.collar, 'collar');
  }
  // support legs every 3.6 units where the tube floats above the seabed
  for (let s = s0 + 2.4; s < s1 - 2.0; s += 4.8) {
    routeFrame(s, P, T, Rt, U);
    const bottomY = P.y + TUBE.cy - TUBE.ro;
    for (const side of [-1, 1]) {
      const ox = P.x + Rt.x * side * 0.62, oz = P.z + Rt.z * side * 0.62;
      const topY = P.y + TUBE.cy - 0.62;
      const fx = P.x + Rt.x * side * 1.25, fz = P.z + Rt.z * side * 1.25;
      const gy = terrainH(fx, fz);
      if (bottomY - gy < 0.35) continue;
      addCapsule(ox, topY, oz, fx, gy - 0.2, fz, 0.13, 'pylon');
      TUBE_SUPPORTS.push({ s, side, top: [ox, topY, oz], foot: [fx, gy, fz] });
    }
  }
  // viaduct piers
  const nP = Math.max(2, Math.round((ROUTE.sV1 - ROUTE.sV0) / 2.3));
  for (let k = 0; k <= nP; k++) {
    const s = lerp(ROUTE.sV0, ROUTE.sV1, k / nP);
    routeSample(s, P, T);
    const gy = terrainH(P.x, P.z);
    VIADUCT_PIERS.push({ s, x: P.x, z: P.z, top: P.y - 0.42, ground: gy, end: k === 0 || k === nP });
    if (gy < 0.2) addCapsule(P.x, gy - 0.2, P.z, P.x, P.y, P.z, 0.75, 'pier');
  }
  for (let i = 0; i < OBST.caps.length; i++) {
    const c = OBST.caps[i], r = c.r + 3.2;
    const i0 = Math.floor((Math.min(c.ax, c.bx) - r) / OBST.cell), i1 = Math.floor((Math.max(c.ax, c.bx) + r) / OBST.cell);
    const k0 = Math.floor((Math.min(c.az, c.bz) - r) / OBST.cell), k1 = Math.floor((Math.max(c.az, c.bz) + r) / OBST.cell);
    for (let a = i0; a <= i1; a++) for (let b = k0; b <= k1; b++) {
      const key = a * 4096 + b;
      let list = OBST.map.get(key);
      if (!list) OBST.map.set(key, list = []);
      list.push(i);
    }
  }
})();

// clearance of a point to solid obstacles only (capsules); capped at 3
function capsuleClearance(x, y, z) {
  const list = OBST.map.get(Math.floor(x / OBST.cell) * 4096 + Math.floor(z / OBST.cell));
  let best = 3;
  if (!list) return best;
  for (const i of list) {
    const c = OBST.caps[i];
    const bx = c.bx - c.ax, by = c.by - c.ay, bz = c.bz - c.az;
    const px = x - c.ax, py = y - c.ay, pz = z - c.az;
    let t = (px * bx + py * by + pz * bz) / (bx * bx + by * by + bz * bz);
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const d = Math.hypot(px - bx * t, py - by * t, pz - bz * t) - c.r;
    if (d < best) best = d;
  }
  return best;
}
// full water clearance: obstacles, seabed / shoreline, surface, glass boundary
function waterClearance(x, y, z) {
  const g = terrainGrad(x, z);
  const bed = (y - terrainH(x, z)) / Math.sqrt(1 + g[0] * g[0] + g[1] * g[1]);
  const surf = -0.12 - y;
  const wall = (1 - ellR(x, z)) * EB;
  return Math.min(capsuleClearance(x, y, z), bed, surf, wall);
}

class LoopPath {

    for (let i = 0; i <= n; i++) { this.X[i] = P[i].x; this.Y[i] = P[i].y; this.Z[i] = P[i].z; }
    this.TX = new Float32Array(n + 1); this.TY = new Float32Array(n + 1); this.TZ = new Float32Array(n + 1);
    for (let i = 0; i <= n; i++) {
      const a = (i - 2 + n) % n, b = (i + 2) % n;
      const dx = this.X[b] - this.X[a], dy = this.Y[b] - this.Y[a], dz = this.Z[b] - this.Z[a], l = Math.hypot(dx, dy, dz);

// stadium-shaped loop (two gentle straights, two semicircles) with a slow depth wave
function stadiumPts(x0, x1, cz, b, y, dy = 0.2, reverse = false, bow = 0) {

function makeCausticTexture(size = 256) {

// steam and smoke puffs from the locomotive chimney / whistle
const STEAM = (() => {
  const N = 90, pos = new Float32Array(N * 3), size = new Float32Array(N), alpha = new Float32Array(N);

      void main(){ vA = aAlpha; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uScale / max(0.5, -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D uTex; uniform vec3 uCol; varying float vA;

    const st = TRAIN.st, loco = TRAIN.loco;

    // chimney: rate grows with speed and acceleration; none inside the glass tunnel
    const rate = inTubeNow ? 0 : 1.2 + st.v * 3 + Math.max(0, st.acc) * 12;
    acc += rate * dt;
    while (acc > 1) {
      acc -= 1;

      const back = V3(-1, 0, 0).applyMatrix4(new THREE.Matrix4().extractRotation(loco.grp.matrix)).multiplyScalar(st.v * 0.6);

  const unlock = () => { AUDIO.unlock(); if (AUDIO.running) body.classList.add('audio-on'); };
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => window.addEventListener(ev, unlock, { passive: true }));
  // hide / show
  const hide = (v) => body.classList.toggle('ui-hidden', v);
  $('btnHide').addEventListener('click', () => hide(true));
  $('btnShow').addEventListener('click', () => hide(false));
  // keyboard
  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' && e.target.type !== 'range')) return;
    const k = e.key.toLowerCase();
    if (k >= '1' && k <= '4') CAM.setMode(['island', 'follow', 'onboard', 'reef'][+k - 1]);
    else if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'w') blow();
    else if (k === 'h') hide(!body.classList.contains('ui-hidden'));
    else if (k === 'm') { AUDIO.setEnabled(!AUDIO.enabled); syncSound(); }
    else if (k === 'l') { const order = ['day', 'golden', 'night']; setLight(order[(order.indexOf(ENV.name) + 1) % 3]); }
  });

  // ---------------------------------------------------------------- route progress indicator
  const svg = $('routeSvg'), NS = 'http://www.w3.org/2000/svg';
  const fx0 = -36, fx1 = 36, fz0 = -13, fz1 = 27, sc = Math.min(228 / (fx1 - fx0), 142 / (fz1 - fz0));
  const ox = (240 - (fx1 - fx0) * sc) / 2, oz = (150 - (fz1 - fz0) * sc) / 2;
  const X = (x) => (ox + (x - fx0) * sc).toFixed(1), Z = (z) => (oz + (z - fz0) * sc).toFixed(1);
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.appendChild(e); return e; };
  let coastD2 = '';
  for (let i = 0; i < COAST_N; i += 4) { const x = clamp(coastX[i], fx0 - 2, fx1 + 2), z = clamp(coastZ[i], fz0 - 2, fz1 + 2); coastD2 += (i ? 'L' : 'M') + X(x) + ' ' + Z(z); }
  const clip = mk('clipPath', { id: 'rpClip' });
  const ce = document.createElementNS(NS, 'ellipse');
  ce.setAttribute('cx', X(0)); ce.setAttribute('cy', Z(0)); ce.setAttribute('rx', (EA * sc).toFixed(1)); ce.setAttribute('ry', (EB * sc).toFixed(1)); clip.appendChild(ce);
  mk('ellipse', { cx: X(0), cy: Z(0), rx: (EA * sc).toFixed(1), ry: (EB * sc).toFixed(1), fill: 'rgba(80,170,190,0.12)', stroke: 'rgba(120,132,142,0.35)', 'stroke-width': 1 });
  mk('path', { d: coastD2 + 'Z', class: 'rp-coast', 'clip-path': 'url(#rpClip)' });
  const pathFrom = (s0, s1, step = 0.6) => { let d = ''; const p = V3(); for (let s = s0, i = 0; s <= s1 + 1e-6; s += step, i++) { routeSample(s, p, null); d += (i ? 'L' : 'M') + X(p.x) + ' ' + Z(p.z); } return d; };
  mk('path', { d: pathFrom(ROUTE.sPE, ROUTE.sPW), class: 'rp-tube' });
  const full = mk('path', { d: pathFrom(ROUTE.sStop, ROUTE.sStop + ROUTE.L), class: 'rp-track' });
  const done = mk('path', { d: pathFrom(ROUTE.sStop, ROUTE.sStop + ROUTE.L), class: 'rp-done' });
  const plen = full.getTotalLength ? full.getTotalLength() : 600;
  done.setAttribute('stroke-dasharray', `0 ${plen}`);
  { const p = V3(); routeSample(ROUTE.sStop - TRAIN.TRAIN_LEN / 2, p, null); mk('rect', { x: (+X(p.x) - 7).toFixed(1), y: (+Z(p.z) - 6.5).toFixed(1), width: 14, height: 4, rx: 1.2, class: 'rp-station' });
    const t = mk('text', { x: X(p.x), y: (+Z(p.z) - 9).toFixed(1), 'text-anchor': 'middle', 'font-size': 7.5, fill: 'currentColor', opacity: 0.75, 'font-family': 'Georgia, serif', 'font-style': 'italic' }); t.textContent = 'Pelagia';
    const pt = V3(); routeSample((ROUTE.sPE + ROUTE.sPW) / 2, pt, null);
    const t2 = mk('text', { x: X(pt.x), y: (+Z(pt.z) + 11).toFixed(1), 'text-anchor': 'middle', 'font-size': 7, fill: '#2f8ea5', 'font-family': 'Georgia, serif', 'font-style': 'italic' }); t2.textContent = 'reef tunnel';
    const pv = V3(); routeSample((ROUTE.sV0 + ROUTE.sV1) / 2, pv, null);
    const t3 = mk('text', { x: X(pv.x), y: (+Z(pv.z) - 5).toFixed(1), 'text-anchor': 'middle', 'font-size': 6.5, fill: 'currentColor', opacity: 0.6, 'font-family': 'Georgia, serif', 'font-style': 'italic' }); t3.textContent = 'viaduct'; }
  const dot = mk('circle', { r: 4, class: 'rp-dot' });
  const tube = document.createElement('b');
  tube.style.left = (wrapS(ROUTE.sPE - ROUTE.sStop) / ROUTE.L * 100) + '%'; tube.style.width = ((ROUTE.sPW - ROUTE.sPE) / ROUTE.L * 100) + '%';
  $('routeBarWrap').appendChild(tube);
  const LABELS = { station: 'Pelagia Station', shore: 'Coastal Line', viaduct: 'Bay Viaduct', headland: 'East Cape', descent: 'Descending into the Sea',
    reef: 'Reef Tunnel', ascent: 'Rising to the Surface', approach: 'Approaching Pelagia' };
  const lbl = $('routeLabel'), meta = $('routeMeta'), bar = $('routeBar');
  let lastLabel = '', lastMeta = '', lastPct = -1;
  function update() {
    const st = TRAIN.st, f = wrapS(st.s - ROUTE.sStop) / ROUTE.L;
    const p = V3(); routeSample(st.s - 1.1, p, null);
    dot.setAttribute('cx', X(p.x)); dot.setAttribute('cy', Z(p.z));
    done.setAttribute('stroke-dasharray', `${(f * plen).toFixed(1)} ${plen}`);
    let text = LABELS[routeSection(st.s - 1.1)] || '';
    if (st.phase === 'dwell') text = st.doors > 0.02 ? 'Pelagia Station \u00b7 doors open' : st.phaseT > 5.4 ? 'Pelagia Station \u00b7 departing' : 'Pelagia Station';
    if (text !== lastLabel) { lbl.textContent = text; lastLabel = text; }
    const pct = Math.floor(f * 100);
    const m = st.playing ? `${pct}% \u00b7 lap ${st.laps + 1}` : `Paused \u00b7 ${pct}%`;
    if (m !== lastMeta) { meta.textContent = m; meta.classList.toggle('paused', !st.playing); lastMeta = m; }
    if (pct !== lastPct) { bar.style.width = (f * 100).toFixed(1) + '%'; lastPct = pct; }
  }
  const fadeHint = () => $('hint').classList.add('fade');
  setTimeout(fadeHint, 25000);
  renderer.domElement.addEventListener('pointerdown', () => setTimeout(fadeHint, 2500), { once: true });
  return { update, setLight, hide, syncPlay };
})();

// ---- 99_main.js ----
// ============================================================================
// MAIN LOOP
// ============================================================================
let dprCap = MAX_DPR;
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_DPR, dprCap));
  renderer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  WATER.resize(db.x, db.y);
  if (CAM.mode === 'island' || CAM.mode === 'reef') CAM.setMode(CAM.mode, true);
}
window.addEventListener('resize', onResize);
renderer.shadowMap.autoUpdate = false;

let simTime = 0;
function simulate(dt) {
  simTime += dt;
  U.uTime.value = simTime;
  TRAIN.update(dt);
  MARINE.update(simTime, dt);
  STEAM.update(dt);
  ISLAND.LH.beam.rotation.y += dt * 0.7;
  for (const b of ISLAND.boats) if (b.floatB) { b.b.position.y = 0.03 + Math.sin(simTime * 1.3 + b.x) * 0.02; b.b.rotation.z = Math.sin(simTime * 0.9) * 0.04; }
}
function updateClocks() {
  const d = new Date(), hrs = d.getHours() % 12 + d.getMinutes() / 60, mins = d.getMinutes() + d.getSeconds() / 60;
  for (const h of ISLAND.clockHands) { h.hr.rotation.z = -hrs / 12 * Math.PI * 2; h.mn.rotation.z = -mins / 60 * Math.PI * 2; }
}
function render() {
  CAM.updateUniforms();
  renderer.shadowMap.needsUpdate = true;
  WATER.renderReflection();
  renderer.render(scene, camera);
}
let lastT = performance.now(), frames = 0, slowT = 0;
function adaptQuality(rawDt) {
  const dpr = renderer.getPixelRatio();
  if (dpr <= 1.001) return;
  slowT = rawDt > 1 / 28 ? slowT + rawDt : Math.max(0, slowT - rawDt * 0.5);
  if (slowT > 3) { dprCap = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dprCap); const db = renderer.getDrawingBufferSize(new THREE.Vector2()); WATER.resize(db.x, db.y); slowT = 0; }
}
function frame(now) {
  const raw = Math.max(0, (now - lastT) / 1000), dt = Math.min(0.1, raw); lastT = now;
  if (frames > 30) adaptQuality(raw);
  simulate(dt);
  const rdt = Math.min(raw, 0.25);            // presentation timing follows the wall clock even on slow devices
  ENV.update(rdt);
  TRAIN.updateLights(dt);
  CAM.update(rdt);
  if (frames++ % 20 === 0) updateClocks();
  UI.update();
  AUDIO.update(dt);
  render();
  requestAnimationFrame(frame);
}
onResize();
CAM.setMode('island', true);
ENV.apply();
simulate(0.001);
render();
requestAnimationFrame(frame);
document.getElementById('loader').classList.add('done');

// inspection hooks used by the automated checks
window.__pelagia = {
  scene, camera, renderer, ENV, ROUTE, TRAIN, CAM, MARINE, UI, terrainH, ellR, TUBE,
  simulate(sec, step = 0.05) { for (let t = 0; t < sec; t += step) { simulate(step); ENV.update(step); } return this.state(); },
  state() {
    const st = TRAIN.st;
    return { s: +st.s.toFixed(2), phase: st.phase, laps: st.laps, v: +st.v.toFixed(2), doors: +st.doors.toFixed(2), section: routeSection(st.s),
      simTime: +simTime.toFixed(1), cam: CAM.mode, light: ENV.name, camPos: camera.position.toArray().map(v => +v.toFixed(2)) };
  },
  safety() { const s = MARINE.stats; return { minClear: +s.minClear.toFixed(3), who: s.minWho, violations: s.violations, checks: s.checks, maxJumpRatio: +s.maxJumpRatio.toFixed(2), backward: s.backward }; },
  couplings() {
    let worst = 0; const a = V3(), b = V3();
    for (const l of TRAIN.links) { a.copy(l.a.cR).applyMatrix4(l.a.grp.matrix); b.copy(l.b.cF).applyMatrix4(l.b.grp.matrix); worst = Math.max(worst, a.distanceTo(b)); }
    return +worst.toFixed(3);
  },
  look(px, py, pz, tx, ty, tz) { CAM.controls.enabled = true; CAM.controls.minDistance = 0.3; camera.position.set(px, py, pz); CAM.controls.target.set(tx, ty, tz); camera.lookAt(tx, ty, tz); CAM.controls.update(); return true; },
};
