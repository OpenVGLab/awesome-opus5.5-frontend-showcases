  }
  cornerFlags.forEach((fl, i) => { fl.rotation.y = 0.6 + Math.sin(animTime * 4 + i) * 0.35; });

  if (camMode === 'director') director(s);
  else if (camMode === 'broadcast') broadcast(s);
  if (camMode !== 'free') {
    const a = s - T.HIT;
    if (camMode === 'director' && !replay && a > 0 && a < 1.2) {
      const k = (1 - a / 1.2) ** 2 * 0.22;
      camPos.x += Math.sin(a * 83) * k; camPos.y += Math.sin(a * 71 + 1) * k; camLook.x += Math.sin(a * 67 + 2) * k * 0.6;
    }
    camera.position.copy(camPos);
    camera.lookAt(camLook);
    if (camera.fov !== camFov) { camera.fov = camFov; camera.updateProjectionMatrix(); }
  } else {
    focusAt(s, focus);
    const prev = freeFocus.clone();
    freeFocus.lerp(focus, 1 - Math.exp(-dtReal * 4));
    const delta = freeFocus.clone().sub(prev);
    camera.position.add(delta);
    controls.target.add(delta);
    controls.update();
  }
  updateGoalText(s);
  sparks.write(camera.position);
  bits.write(camera.position);

  focusAt(s, focus);
  sun.position.set(focus.x - 18, 42, focus.z - 24);
  sun.target.position.set(focus.x, 0, focus.z);
  sky.position.copy(camera.position);
  updateHUD();
}

/* ============================== main loop ============================== */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
  last = now;
  if (!paused) advance(dt);
  updateScene(dt);
  composer.render();
  requestAnimationFrame(frame);
}
layoutHUD();
const params = new URLSearchParams(location.search);
if (params.has('t')) seek(parseFloat(params.get('t')) || 0, params.get('replay') === '1');
if (params.get('paused') === '1') paused = true;
if (params.get('cam')) setMode(params.get('cam'));
if (params.get('hud') === '0') $('hud').classList.add('off');
drawButtons();
requestAnimationFrame(frame);

window.__soccer = {
  seek: (t, rep = false) => { looped = false; seek(t, rep); },
  pause: () => { paused = true; drawButtons(); }, play: () => { paused = false; drawButtons(); },
  cam: (m) => setMode(m), get story() { return story; }, get replay() { return replay; },
  info: () => ({ story, replay, paused, camMode, TLINE: T_LINE, HIT: T.HIT, crowd: crowd.length, sparks: sparks.n, bits: bits.n,
    ballAtLine: ballAt(T_LINE), volleyPt, d2AtArc: trD2.at((T.FL1 + T.V) / 2), calls: renderer.info.render.calls, tris: renderer.info.render.triangles }),
};
</script>
