<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellwise · Smart Spreadsheet</title>
<meta name="description" content="A smart spreadsheet in the browser: formulas, merges, sorting, filters, charts and Excel import/export.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366F1'/%3E%3Cstop offset='1' stop-color='%238B5CF6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Crect x='7' y='8' width='18' height='16' rx='2.5' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M7 14h18M7 19h18M13 8v16' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#logoGrad)"/>
        <rect x="7" y="8" width="18" height="16" rx="2.5" fill="none" stroke="#fff" stroke-width="2"/>
        <path d="M7 14h18M7 19h18M13 8v16" stroke="#fff" stroke-width="1.6" opacity=".9"/>
        <rect x="13.9" y="14.9" width="10.2" height="3.3" fill="#FDE68A"/>
      </svg>
      <span class="brand-name">Cellwise</span>
    </div>
    <div class="doc">
      <input id="docTitle" class="doc-title" spellcheck="false" aria-label="Workbook title">
      <span class="save-state" id="saveState"><i data-icon="cloudCheck" data-size="13"></i><span>Saved in this browser</span></span>
    </div>
    <nav class="menubar" id="menubar" aria-label="Main menu">
      <button type="button" data-menu="file">File</button>
      <button type="button" data-menu="edit">Edit</button>
      <button type="button" data-menu="insert">Insert</button>
      <button type="button" data-menu="format">Format</button>
      <button type="button" data-menu="data">Data</button>
      <button type="button" data-menu="view">View</button>
      <button type="button" data-menu="help">Help</button>
    </nav>
    <div class="top-actions">
      <button type="button" class="btn" data-cmd="import" data-tip="Open an .xlsx or .csv file (or drop it on the page)"><i data-icon="upload"></i>Import</button>
      <button type="button" class="btn primary" data-cmd="exportMenu" data-tip="Download as Excel / CSV / PNG"><i data-icon="download"></i>Export<i data-icon="chevDown" data-size="14"></i></button>
    </div>
  </header>

  <div class="toolbar" id="toolbar" role="toolbar">
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="undo" data-tip="Undo (Ctrl+Z)"><i data-icon="undo"></i></button>
      <button type="button" class="tb" data-cmd="redo" data-tip="Redo (Ctrl+Y)"><i data-icon="redo"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb tb-select" id="nfBtn" data-cmd="numFmtMenu" data-tip="Number format"><span id="nfLabel">General</span><i data-icon="chevDown" data-size="14"></i></button>
      <button type="button" class="tb" data-cmd="fmtCurrency" data-tip="Currency format"><i data-icon="currency"></i></button>
      <button type="button" class="tb" data-cmd="fmtPercent" data-tip="Percent format"><i data-icon="percent"></i></button>
      <button type="button" class="tb" data-cmd="decDec" data-tip="Decrease decimal places"><i data-icon="decDec" data-size="18"></i></button>
      <button type="button" class="tb" data-cmd="decInc" data-tip="Increase decimal places"><i data-icon="decInc" data-size="18"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb tb-select narrow" id="fsBtn" data-cmd="fontSizeMenu" data-tip="Font size (pt)"><span id="fsLabel">10</span><i data-icon="chevDown" data-size="14"></i></button>
      <button type="button" class="tb" data-cmd="bold" data-state="b" data-tip="Bold (Ctrl+B)"><i data-icon="bold"></i></button>
      <button type="button" class="tb" data-cmd="italic" data-state="i" data-tip="Italic (Ctrl+I)"><i data-icon="italic"></i></button>
      <button type="button" class="tb" data-cmd="underline" data-state="u" data-tip="Underline (Ctrl+U)"><i data-icon="underline"></i></button>
      <button type="button" class="tb" data-cmd="strike" data-state="st" data-tip="Strikethrough (Ctrl+5)"><i data-icon="strike"></i></button>
      <button type="button" class="tb split" data-cmd="textColor" data-tip="Text color"><span class="color-ico"><i data-icon="textColor"></i><span class="swatch" id="fcSwatch"></span></span></button><button type="button" class="tb caret" data-cmd="textColorMenu" data-tip="Choose text color"><i data-icon="chevDown" data-size="12"></i></button>
      <button type="button" class="tb split" data-cmd="fillColor" data-tip="Fill color"><span class="color-ico"><i data-icon="fill"></i><span class="swatch" id="bgSwatch"></span></span></button><button type="button" class="tb caret" data-cmd="fillColorMenu" data-tip="Choose fill color"><i data-icon="chevDown" data-size="12"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="bordersMenu" data-tip="Borders"><i data-icon="borders"></i><i data-icon="chevDown" data-size="12" class="mini"></i></button>
      <button type="button" class="tb split labeled" data-cmd="merge" data-state="merged" data-tip="Merge & center / unmerge"><i data-icon="merge"></i><span>Merge</span></button><button type="button" class="tb caret" data-cmd="mergeMenu" data-tip="More merge options"><i data-icon="chevDown" data-size="12"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="alignLeft" data-state="ha:left" data-tip="Align left"><i data-icon="alignLeft"></i></button>
      <button type="button" class="tb" data-cmd="alignCenter" data-state="ha:center" data-tip="Align center"><i data-icon="alignCenter"></i></button>
      <button type="button" class="tb" data-cmd="alignRight" data-state="ha:right" data-tip="Align right"><i data-icon="alignRight"></i></button>
      <button type="button" class="tb" data-cmd="wrap" data-state="wrap" data-tip="Wrap text"><i data-icon="wrap"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="insertMenu" data-tip="Insert rows / columns"><i data-icon="rowInsert"></i><i data-icon="chevDown" data-size="12" class="mini"></i></button>
      <button type="button" class="tb" data-cmd="deleteMenu" data-tip="Delete rows / columns"><i data-icon="rowDelete"></i><i data-icon="chevDown" data-size="12" class="mini"></i></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb" data-cmd="sortAsc" data-tip="Sort A → Z"><i data-icon="sortAsc"></i></button>
      <button type="button" class="tb" data-cmd="sortDesc" data-tip="Sort Z → A"><i data-icon="sortDesc"></i></button>
      <button type="button" class="tb labeled" data-cmd="filterToggle" data-state="filter" data-tip="Create / remove filter (Ctrl+Shift+L)"><i data-icon="filter"></i><span>Filter</span></button>
    </div>
    <div class="tb-group">
      <button type="button" class="tb labeled accent" data-cmd="chartMenu" data-tip="Insert a chart from the selection"><i data-icon="chartBar"></i><span>Chart</span><i data-icon="chevDown" data-size="12" class="mini"></i></button>
      <button type="button" class="tb" data-cmd="autosumMenu" data-tip="AutoSum & functions (Alt+=)"><i data-icon="sigma"></i><i data-icon="chevDown" data-size="12" class="mini"></i></button>
      <button type="button" class="tb labeled" data-cmd="recordForm" data-tip="Record form: add, edit & delete table rows"><i data-icon="form"></i><span>Form</span></button>
    </div>
  </div>

  <div class="formula-bar">
    <input id="nameBox" class="name-box" spellcheck="false" aria-label="Cell reference" title="Type a reference like C10 or A1:D8 and press Enter">
    <button type="button" class="fx-btn" data-cmd="functions" data-tip="Insert function (Shift+F3)"><i data-icon="fx" data-size="17"></i></button>
    <div class="fb-wrap" id="fbWrap">
      <div class="fb-mirror" id="fbMirror" aria-hidden="true"></div>
      <textarea id="fbInput" rows="1" wrap="off" spellcheck="false" aria-label="Formula bar"></textarea>
    </div>
  </div>

  <main class="main">
    <div class="grid-wrap" id="gridWrap">
      <canvas id="gridCanvas"></canvas>
      <div class="grid-scroll" id="gridScroll"><div class="grid-spacer"></div></div>
      <div class="charts-viewport" id="chartsViewport"><div class="charts-layer" id="chartsLayer"></div></div>
      <div class="cell-editor idle" id="editorWrap">
        <div class="editor-mirror" id="editorMirror" aria-hidden="true"></div>
        <textarea id="cellEditor" spellcheck="false" autocomplete="off" aria-label="Cell editor"></textarea>
      </div>
      <div class="drop-overlay" id="dropOverlay"><div><i data-icon="upload" data-size="28"></i><div>Drop an .xlsx or .csv file to open it</div></div></div>
    </div>
    <aside class="side-panel" id="sidePanel" hidden></aside>
  </main>

  <footer class="bottombar">
    <button type="button" class="tab-add" data-cmd="addSheet" data-tip="Add sheet (Shift+F11)"><i data-icon="plus"></i></button>
    <div class="tabs" id="tabs"></div>
    <div class="status" id="status"></div>
  </footer>
</div>
<div id="popups"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".xlsx,.xlsm,.csv,.tsv,.txt" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
