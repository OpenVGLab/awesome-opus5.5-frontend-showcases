<style>

  // ───────────────────────── camera ─────────────────────────
  // [portrait, landscape] pairs; the rig blends between them with the aspect ratio.
  const CAMS = {

  // ───────────────────────── palette application ─────────────────────────
  const keyDir = new THREE.Vector3();

  function animateRig(dt, yR, time) {
    const s = G.state;
    rig.root.position.set(0, yR, 0);

    let yawT = 0, yawL = 11;

    yawT = anim.yaw + Math.atan2(Math.sin(yawT - anim.yaw), Math.cos(yawT - anim.yaw));
    anim.yaw = damp(anim.yaw, yawT, yawL, dt);
    rig.yawG.rotation.y = anim.yaw;

    if (s === 'play') {
      const pt = clamp(G.vy * 0.07, -1.2, 0.5);
      anim.pitch = damp(anim.pitch, pt, G.vy > 0 ? 16 : 6, dt);
      anim.roll = damp(anim.roll, 0, 6, dt);

      else if (t < 0.3) w = lerp(-0.85, 0.78, easeInOut((t - 0.07) / 0.23));
      else if (t < 0.56) w = lerp(0.78, glide, easeOut((t - 0.3) / 0.26));
      else w = glide + Math.sin(time * 11) * 0.035;
    } else {
      w = damp(anim.wing, G.landed ? -0.5 : 0.9 + Math.sin(time * 30) * 0.2, G.landed ? 5 : 8, dt);
    }
    anim.wing = w;
    const dw = (w - anim.prevWing) / Math.max(dt, 1e-4);
    const twist = clamp(dw * 0.012, -0.35, 0.35);
    rig.wings[0].rotation.set(twist, 0, -w);
    rig.wings[1].rotation.set(twist, 0, w);

    // squash & stretch spring
    anim.sqV += (-260 * anim.sq - 13 * anim.sqV) * dt;
    anim.sq += anim.sqV * dt;
    const sq = clamp(anim.sq, -0.22, 0.14);
    rig.body.scale.set(1 - sq * 0.5, 1 + sq, 1 - sq * 0.5);

    // antennae & tail lag behind
    anim.antV += (-120 * anim.ant - 7 * anim.antV) * dt;
    anim.ant += anim.antV * dt;
    rig.ants.forEach((a, i) => {
      a.g.rotation.x = a.base + anim.ant * (0.09 + i * 0.02) + Math.sin(time * 2.1 + i) * 0.04;
      a.g.rotation.z = Math.sin(time * 1.7 + i * 2) * 0.05;
    });
    anim.tailV += (-160 * anim.tail - 8 * anim.tailV) * dt;
    anim.tail += anim.tailV * dt;
    rig.tail.rotation.x = -anim.tail * 0.06 + (s === 'ready' ? Math.sin(anim.hoverPhase + 1) * 0.12 : 0);
    rig.tail.rotation.y = Math.sin(time * 3.1) * 0.12;

    // eyes: blink, or squeeze shut after a crash
    anim.blinkT -= dt;
    if (anim.blinkT < 0) { anim.blink = 0.14; anim.blinkT = 2.2 + Math.random() * 3.5; }
    anim.blink = Math.max(0, anim.blink - dt);
    const closed = s === 'dead' || s === 'over';
    const lid = closed ? 0.14 : anim.blink > 0 ? 1 - Math.sin((anim.blink / 0.14) * Math.PI) * 0.9 : 1;
    for (const e of rig.eyes) e.scale.y = damp(e.scale.y, lid, 30, dt);

    for (let i = 0; i < 3; i++) {
      const on = s === 'over' || (s === 'dead' && G.landed);
      dazed[i].visible = on;
      if (on) {
        const a = time * 2.6 + (i * TAU) / 3;
        dazed[i].position.set(Math.cos(a) * 0.46, yR + 0.62 + Math.sin(time * 5 + i) * 0.05, Math.sin(a) * 0.46);
        dazed[i].material.opacity = 0.65 + 0.35 * Math.sin(time * 6 + i * 2);
      }
    }
  }

  // ───────────────────────── loop ─────────────────────────
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    if (G.state === 'ready') anim.yaw = readyYaw();
  }
  window.addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  layoutRun();
  anim.yaw = readyYaw();
  refreshUI();

  let last = performance.now(), acc = 0, perfT = 0, perfN = 0, perfSum = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    let dt = (now - last) / 1000;
    last = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;
    const time = now / 1000;
    if (!G.paused) {
      acc += dt;
      let steps = 0;
      while (acc >= STEP && steps < 14) { update(STEP); acc -= STEP; steps++; }
      if (steps === 14) acc = 0;
    }
    animate(G.paused ? 0 : dt, G.paused ? 1 : acc / STEP, time);
    Sound.tick(dt);
    renderer.render(scene, camera);

    // gently lower resolution on devices that cannot keep up
    perfT += dt; perfSum += dt; perfN++;
    if (perfT > 3 && perfN > 30) {
      const avg = perfSum / perfN;
      if (avg > 1 / 40 && dpr > 1) { dpr = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dpr); resize(); }
      perfT = 0; perfSum = 0; perfN = 0;
    }
  }
  requestAnimationFrame(frame);
  return true;
}
</script>
</body>
