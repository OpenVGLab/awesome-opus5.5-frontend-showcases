async function probeAssets() {

      AU.tone(mf(arp[s]), sd * 3, { vol: 0.07, when, dest: D, a: 0.01 });
      if (s === 0) AU.tone(mf(ch[0]), sd * 7, { vol: 0.09, when, dest: D, a: 0.05 });

      if (s % 2 === 1) AU.noise(0.04, { type: 'highpass', f: 6000, vol: 0.05, when, dest: D });

    }

};

  const top = PET.y - 292 + PET.info.top;

const petMouth = () => ({ x: PET.x, y: PET.y - 292 + PET.info.mouth });
const petTop = () => PET.y - 292 + PET.info.top;
const petCenter = () => ({ x: PET.x, y: PET.y - PET.info.h * 0.55 });

function idleSeg() {
  const N = S.needs;
  if (S.sleeping) return 'sleep';
  if (S.sick) return 'sick';
  if (S.angry) return 'angry';
  if (S.stuffedT > 0) return 'stuffed';
  if (N.energy < 18) return 'sleepy';
  if (N.food < 22) return 'hungry';
  if (N.mood < 22) return 'sad';

}
function petIdle(force) {
  if (!PET.anim || PET.busy || PET.walking || PET.jump || PET.reacting) return;
  const s = idleSeg();
  const sp = (S.sick || S.needs.mood < 35 || S.needs.energy < 25) ? 0.8 : 1;
  if (force || PET.seg !== s || PET.speed !== sp) { PET.speed = sp; petSeg(s, { loop: true, speed: sp }); }
}
// a short celebration that any new action may interrupt
function petReact(seg, times = 1) {

  PET.walking = false;
  PET.seg = seg;
  PET.anim.play(seg, { loop: times > 1 ? times - 1 : false, done: () => { PET.reacting = false; PET.seg = null; petIdle(true); } });
  PET.reacting = true;
}
function petDo(seg, o = {}) {
  PET.busy = true; PET.walking = false; PET.reacting = false;
  PET.anim.play(seg, { loop: o.times > 1 ? o.times - 1 : false, speed: o.speed || 1,
    done: () => { PET.busy = false; PET.seg = null; if (o.then) o.then(); else petIdle(true); } });
  PET.seg = seg;
}
function petWalkTo(x, done) {
  PET.tx = clamp(x, 120, 1160);
  PET.walkDone = done || null;
  PET.reacting = false;
  PET.walking = true;
  PET.face = PET.tx < PET.x ? -1 : 1;
  petSeg('walk', { loop: true });
}
function petJump(x, y, dur, done) {
  PET.walking = false; PET.reacting = false;
  PET.face = x < PET.x ? -1 : 1;
  PET.jump = { x0: PET.x, y0: PET.y, x1: x, y1: y, t: 0, dur, done };
  petSeg('play', { loop: true });
}
function petUpdate(dt) {
  if (!PET.anim) return;
  if (PET.jump) {
    const j = PET.jump; j.t += dt;
    const p = clamp(j.t / j.dur, 0, 1);
    PET.x = lerp(j.x0, j.x1, p);
    PET.y = lerp(j.y0, j.y1, p) - Math.sin(p * Math.PI) * 70;
    if (p >= 1) { PET.jump = null; PET.y = j.y1; if (j.done) j.done(); }
    petPlace();
    return;
  }
  if (PET.walking) {
    const v = (PET.form === 'baby' ? 80 : 100) * dt;
    const d = PET.tx - PET.x;
    if (Math.abs(d) <= v) {
      PET.x = PET.tx; PET.walking = false;
      const f = PET.walkDone; PET.walkDone = null;
      if (f) f(); else petIdle(true);
    } else PET.x += Math.sign(d) * v;

  }
}
function petEmote(kind) {

// newest message wins; a message stays up at least 0.8 s before the next one replaces it

function toast(msg, sec = 2.8, imp = false) {
  if (!msg || !H.toast) return;
  if (H.cur === msg && G.msgT > 0) { G.msgT = Math.max(G.msgT, sec * 0.6); return; }
  G.msgQ = [{ msg, sec, imp }];

}

  const fresh = H.toast.classList.contains('hidden');
  H.cur = m.msg;
  G.curImp = !!m.imp;
  H.toast.classList.remove('hidden');
  H.toastT.textContent = m.msg;
  if (fresh) H.toastA.play('in', { done: () => H.toastA.play('idle', { loop: true }) });
  G.msgT = m.sec;
  G.msgShown = 0;
}
function updateToast(dt) {

    G.msgShown = (G.msgShown || 0) + dt;
    G.msgT -= dt;
    if (G.msgT <= 0 || (G.msgQ.length && G.msgShown >= 0.8 && (!G.curImp || G.msgQ[0].imp))) nextToast();
  }
}

    const warn = lv < 25;
    if (warn !== h.warn) { h.warn = warn; if (warn) h.icon.play(n, { loop: true }); else h.icon.show(n); h.val.style.color = warn ? '#E0584F' : '#8A5A3C'; }
  });
  const status = [S.sick && '生病中', S.angry && '闹脾气', S.stuffedT > 0 && '吃撑了', S.sleeping && '睡觉中'].filter(Boolean).join(' · ');

function settle(sec) {
  const s = Math.min(sec, 1800);
  let t = s;

  while (t > 0) { const d = Math.min(1, t); sim(d, true); t -= d; }
  G.offline = false;
  return s;
}

// ------------------------------------------------------------ simulation
function sim(dt, offline) {
  const d = DIFF[S.diff];
  const N = S.needs;
  S.gameMin += dt * 6;
  let k = d.decay * (S.sick ? 1.3 : 1);
  const sl = S.sleeping ? 0.45 : 1;
  N.food -= BASE_DECAY.food * k * sl * dt;
  N.mood -= BASE_DECAY.mood * k * sl * (S.rain > 0 ? 1.4 : 1) * (S.angry ? 1.3 : 1) * dt;
  N.clean -= BASE_DECAY.clean * k * sl * dt;
  if (S.sleeping) N.energy += 1.25 * (S.sick ? 0.6 : 1) * dt;
  else N.energy -= BASE_DECAY.energy * k * (isNight() ? 1.35 : 1) * dt;
  NEEDS.forEach((n) => { N[n] = clamp(N[n], 0, 100); });
  if (S.stuffedT > 0) S.stuffedT = Math.max(0, S.stuffedT - dt);
  if (S.rain > 0) { S.rain -= dt; if (S.rain <= 0) { S.rain = 0; if (!offline) rainEnd(); } }
  if (S.gift > 0 && !offline) { S.gift -= dt; if (S.gift <= 0) { S.gift = 0; removeGift(); } }
  S.lowClean = N.clean < d.sick[0] ? S.lowClean + dt : Math.max(0, S.lowClean - dt * 2);
  S.lowMood = N.mood < d.angry[0] ? S.lowMood + dt : Math.max(0, S.lowMood - dt * 2);
  S.lowFood = d.starve && N.food < d.starve[0] ? S.lowFood + dt : Math.max(0, S.lowFood - dt * 2);
  if (!S.sick && S.lowClean > d.sick[1]) becomeSick('dirty');
  if (!S.sick && d.starve && S.lowFood > d.starve[1]) becomeSick('hungry');
  if (!S.angry && !S.sleeping && S.lowMood > d.angry[1]) becomeAngry();
  if (Math.min(N.food, N.mood, N.clean, N.energy) < 20) S.stats.neglect += dt;
  if (!offline && !S.sick && !S.angry && (S.stage === 'baby' || S.stage === 'teen')) {
    const avg = (N.food + N.mood + N.clean + N.energy) / 4, mn = Math.min(N.food, N.mood, N.clean, N.energy);
    let g = 0;
    if (S.sleeping) g = 0.22;
    else if (avg >= 60 && mn >= 30) g = 0.55 * avg / 100;
    else if (avg >= 40) g = 0.12;
    S.growth += g * dt;
  }
  if (S.sleeping && N.energy >= 100 && !offline) wake(true);
  if (S.sleeping && N.energy >= 100 && offline) { S.sleeping = false; S.stats.sleeps++; }
}
function becomeSick(why) {
  S.sick = true; S.lowClean = 0; S.lowFood = 0; S.stats.sick++;
  if (G.offline) return;
  SFX.sick();
  toast(why === 'hungry' ? '饿太久了，' + S.name + '饿出病来了！快「治疗」吧' : why === 'stuffed' ? '吃得太撑，' + S.name + '肚子疼生病了！' : '身上太脏，' + S.name + '生病了！快「治疗」吧', 3.4, true);
  if (!PET.busy && !S.sleeping) petIdle(true);
  petEmote('sick');
}
function becomeAngry() {

  if (G.offline) return;

}
function needWarnings() {
  const N = S.needs;
  const tips = { food: [25, '肚子饿了，喂点东西吧', 'hungry'], mood: [25, '有点不开心，陪它玩一会儿吧', 'sad'], clean: [25, '身上脏脏的，该洗澡了', 'dirty'], energy: [20, '困了，关灯让它睡一觉吧', 'tired'] };

}

  updateHUD();

// ------------------------------------------------------------ growth / evolution
function checkStage() {
  if (G.evolving || PET.busy || BATH.on || S.sleeping || PAT.on) return;
  if (S.stage === 'baby' && S.growth >= GROW_TEEN) evolve('teen');
  else if (S.stage === 'teen' && S.growth >= GROW_ADULT) evolve('adult');
}
function pickForm() {
  const s = S.stats;
  const sc = { star: s.plays * 3 + s.stars * 0.25 + s.soothes, cream: s.cake * 3 + s.feed * 0.6 + s.stuffed * 2,
    cloud: s.baths * 3 + s.sleeps * 3, imp: s.sick * 5 + s.angry * 5 + s.neglect / 20 };
  let best = 'star';
  ['star', 'cream', 'cloud', 'imp'].forEach((f) => { if (sc[f] > sc[best]) best = f; });
  return best;
}
function evolve(to) {
  G.evolving = true;

        else { toast(S.name + '长成少年了！', 3, true); petIdle(true); }

}

function bathLabel() { H.bathTxt.textContent = BATH.on ? '泡泡 ' + BATH.count + ' / ' + BATH.max : ''; }
function bathMove(p, down) {
  if (!BATH.on || !W.sponge) return;
  W.sponge.pos(p.x - 55, p.y - 50);
  if (!down || BATH.rinsing) return;
  const c = petCenter();
  const near = Math.hypot(p.x - c.x, (p.y - c.y) * 1.2) < PET.info.h * 0.85;
  const d = Math.hypot(p.x - BATH.lx, p.y - BATH.ly);
  BATH.lx = p.x; BATH.ly = p.y;
  if (!near) return;
  BATH.dist += d;
  if (W.sponge.cur !== 'scrub') W.sponge.play('scrub', { loop: true });
  if (BATH.dist > 28 && BATH.count < BATH.max) {
    BATH.dist = 0;
    BATH.count++;
    const b = new Anim(W.fxL, 'fx_bubble', { w: 90, h: 150, x: p.x - 45 + rand(-8, 8), y: p.y - 115 + rand(-8, 8), world: true });
    b.play('spawn', { done: () => b.play('idle', { loop: true }) });
    BATH.bubbles.push(b);
    SFX.bubble();
    if (BATH.count % 3 === 0) SFX.scrub();
    if (BATH.count >= 3) H.rinse.setMode(BATH.count >= BATH.max ? 'alert' : 'idle');
    bathLabel();
    if (BATH.count >= BATH.max) toast('泡泡满满！点「冲水」冲干净吧');

}
function bathRinse() {
  if (!BATH.on || BATH.rinsing) return;
  if (BATH.count < 3) { toast('再多搓几下泡泡吧'); return; }
  BATH.rinsing = true;
  H.rinse.show(false); H.bathTxt.textContent = '';

  if (W.sponge) { W.sponge.destroy(); W.sponge = null; }

    S.needs.mood = clamp(S.needs.mood + 5, 0, 100);

  });
}

  if (W.sponge) { W.sponge.destroy(); W.sponge = null; }
  H.rinse.show(false); H.bathTxt.textContent = '';
  stage.classList.remove('nocursor');
  writeSave();
}

function doPlay() {

}
function miniStart() {
  MG.on = true; MG.ended = false; MG.t = 30; MG.score = 0; MG.combo = 0; MG.x = 640; MG.spawnT = 0.8; MG.ready = 2.2; MG.dragX = null;
  MG.keys.l = MG.keys.r = false;
  setScreen('mini');
  worldSleep(true);
  MG.bg.play('loop', { loop: true });
  const form = S.stage === 'adult' ? S.form : S.stage;
  if (MG.pet) MG.pet.destroy();
  MG.pet = new Anim(MG.petL, 'pet_' + form, { w: 320, h: 320, world: true, mini: true });
  MG.pet.el.style.transformOrigin = '160px 0';
  MG.pet.play('play', { loop: true });
  MG.info = PINFO[form];
  miniPlace();
  MG.timeT.textContent = '30'; MG.scoreT.textContent = '0';
  MG.big.textContent = '准备……';
  Music.set('game');
  SFX.count();
}
function miniPlace() { MG.pet.el.style.transform = `translate(${MG.x - 160}px,${600 - 292}px) scaleX(${MG.face})`; }
function miniTick(dt) {
  if (!MG.on || MG.ended) return;
  if (MG.ready > 0) {
    const before = MG.ready;
    MG.ready -= dt;
    if (before > 1.0 && MG.ready <= 1.0) { MG.big.textContent = '开始！'; SFX.go(); }
    if (MG.ready <= 0) MG.big.textContent = '';
  }
  // move
  let vx = 0;
  if (MG.keys.l) vx -= 1;
  if (MG.keys.r) vx += 1;
  if (vx) MG.x += vx * 460 * dt;
  else if (MG.dragX != null) { const d = MG.dragX - MG.x; MG.x += Math.sign(d) * Math.min(Math.abs(d), 760 * dt); if (Math.abs(d) > 4) vx = Math.sign(d); }
  MG.x = clamp(MG.x, 90, 1190);
  if (vx) MG.face = vx < 0 ? -1 : 1;
  miniPlace();
  if (MG.ready > 0) return;
  MG.t -= dt;
  MG.timeT.textContent = Math.max(0, Math.ceil(MG.t));
  // spawn
  MG.spawnT -= dt;
  if (MG.spawnT <= 0 && MG.t > 0.8) {
    const prog = 1 - MG.t / 30;
    MG.spawnT = rand(0.5, 0.85) - prog * 0.18;
    spawnStar(prog);
  }
  const top = 600 - 292 + MG.info.top;
  for (let i = MG.stars.length - 1; i >= 0; i--) {
    const s = MG.stars[i];
    if (s.dead) continue;
    s.y += s.v * dt;
    s.a.pos(s.x - 50, s.y - 50);
    if (s.y > top - 10 && s.y < 600 && Math.abs(s.x - MG.x) < 72) {
      s.dead = true;
      MG.score += s.gold ? 3 : 1; MG.combo++;
      MG.scoreT.textContent = MG.score;
      if (s.gold) SFX.gold(); else SFX.star(MG.combo % 8);
      s.a.play('catch', { done: () => removeStar(s) });
      continue;
    }
    if (s.y >= 612) {
      s.dead = true; MG.combo = 0;
      SFX.miss();
      s.a.play('miss', { done: () => removeStar(s) });
    }
  }
  if (MG.t <= 0) miniFinish();
}
function spawnStar(prog) {
  const gold = Math.random() < 0.13;
  const a = new Anim(MG.starL, 'star', { w: 100, h: 100, world: true, mini: true });
  a.play(gold ? 'gold' : 'fall', { loop: true });
  const s = { a, gold, x: rand(80, 1200), y: -50, v: rand(210, 320) + prog * 120, dead: false };
  a.pos(s.x - 50, s.y - 50);
  MG.stars.push(s);
}
function removeStar(s) { s.a.destroy(); const i = MG.stars.indexOf(s); if (i >= 0) MG.stars.splice(i, 1); }
function miniFinish() {
  MG.ended = true;
  MG.big.textContent = '时间到！';
  SFX.fanfare();
  MG.stars.forEach((s) => { if (!s.dead) { s.dead = true; s.a.play('miss', { done: () => removeStar(s) }); } });
  MG.pet.play('happy', { loop: true });
  const gain = Math.min(45, 6 + Math.round(MG.score * 1.6));
  MG.gain = gain;
  after(1.3, () => {
    SC.resT1.textContent = '接到了 ' + MG.score + ' 颗星星！';
    SC.resT2.textContent = '心情 +' + gain + '　体力 -12　饱食 -6';
    G.overlay = 'result';
    SC.result.open();
  }, false);
}
function miniClose() {
  if (!MG.on) return;
  const N = S.needs;
  N.mood = clamp(N.mood + MG.gain, 0, 100);
  N.energy = clamp(N.energy - 12, 0, 100);
  N.food = clamp(N.food - 6, 0, 100);
  S.growth += 2 + MG.score * 0.3;
  S.stats.plays++; S.stats.stars += MG.score;
  G.overlay = null;
  SC.result.close();
  miniEnd(false);
  hearts(PET.x, petTop() + 20);
  petReact('happy', 2);
  SFX.happy();
  writeSave();
}
function miniEnd(abort) {
  MG.on = false; MG.big.textContent = '';
  MG.stars.slice().forEach(removeStar);
  if (MG.pet) { MG.pet.destroy(); MG.pet = null; }
  MG.bg.a.pause();
  worldSleep(false);
  if (!abort) { setScreen('room'); Music.set(S.sleeping ? 'night' : 'day'); }
}

// ============================================================ overlays: pause, help, welcome, ending

function closeAllPanels() {
  ['pause', 'help', 'welcome', 'feed', 'result'].forEach((k) => { if (SC[k] && SC[k].isOpen) { SC[k].isOpen = false; SC[k].root.classList.add('hidden'); } });
  if (SC.namePanel && SC.namePanel.isOpen && G.screen !== 'name') { SC.namePanel.isOpen = false; SC.namePanel.root.classList.add('hidden'); }
  G.overlay = null;
  freeze(false);
}
function freeze(on) {
  if (on === G.paused) return;
  G.paused = on;
  if (on) {
    G.freezeList = [];
    WORLD_ANIMS.forEach((a) => { if (!a.a.isPaused) { G.freezeList.push(a); a.a.pause(); } });
  } else {
    G.freezeList.forEach((a) => { if (WORLD_ANIMS.has(a)) a.a.play(); });
    G.freezeList = [];
  }
}
function openPause() {
  if (!(G.screen === 'room' || G.screen === 'mini') || G.overlay === 'pause') return;
  if (G.overlay === 'help') closeHelp();
  if (G.overlay) return;
  G.overlay = 'pause';
  G.confirmRestart = false;
  SC.restartBtn.setLabel('重新开始');
  SC.pauseInfo.textContent = S ? S.name + ' · ' + STAGE_NAME[S.stage] + ' · 第 ' + dayNum() + ' 天 · 难度 ' + DIFF[S.diff].name : '';
  freeze(true);
  SC.pause.open();
}
function closePause() { if (G.overlay !== 'pause') return; G.overlay = null; SC.pause.close(() => freeze(false)); }
function restartClick() {
  if (!G.confirmRestart) { G.confirmRestart = true; SC.restartBtn.setLabel('再点一次确认'); return; }
  const d = S ? S.diff : G.diff;
  clearSave();
  closeAllPanels();
  bathEnd(true);
  if (MG.on) miniEnd(true);
  startNew(d);
}
function openHelp() {
  if (G.overlay === 'help') return;
  if (G.overlay && G.overlay !== 'pause') return;
  G.helpFromPause = G.overlay === 'pause';
  if (G.helpFromPause) { SC.pause.isOpen = false; SC.pause.root.classList.add('hidden'); }
  G.overlay = 'help';
  if (G.screen === 'room' || G.screen === 'mini') freeze(true);
  SC.help.open();
}
function closeHelp() {
  if (G.overlay !== 'help') return;
  G.overlay = null;
  SC.help.close(() => { if (G.helpFromPause) { G.overlay = 'pause'; SC.pause.open(); } else freeze(false); });
}

  NEEDS.forEach((n, i) => { SC.welRows[i].textContent = NEED_NAME[n] + '　' + Math.round(before[n]) + ' → ' + Math.round(S.needs[n]); });
  const probs = [];
  if (S.sick && !wasSick) probs.push('它生病了，快治疗！');
  if (S.angry && !wasAngry) probs.push('它在闹脾气，哄哄它吧！');
  SC.welT2.textContent = probs.join('　') || (Math.min(...NEEDS.map((n) => S.needs[n])) < 30 ? '它有点想你了，快照顾它吧' : '');
  SC.welT2.style.color = probs.length ? '#E0584F' : '#8A5A3C';

  SC.welcome.open();
}

function showEnding() {

  Music.set('day');

}
function toggleMute() {
  AU.init();
  AU.setMuted(!AU.muted);
  if (H.mute) H.mute.setIcon('icons_ui', AU.muted ? 'sound_off' : 'sound_on');
  if (G.screen === 'room' || G.screen === 'title') toast(AU.muted ? '已静音（M 键切换）' : '声音已打开', 1.6);
}

// ============================================================ input
function onKey(e, down) {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key;
  if (down) AU.init();
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { MG.keys.l = down; if (MG.on) e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { MG.keys.r = down; if (MG.on) e.preventDefault(); }
  if (!down || e.repeat) return;
  if (k === 'm' || k === 'M') toggleMute();
  else if (k === 'p' || k === 'P') { if (G.overlay === 'pause') closePause(); else openPause(); }
  else if (k === 'h' || k === 'H') { if (G.overlay === 'help') closeHelp(); else if (G.screen !== 'loading') openHelp(); }
  else if (k === 'Escape') { if (G.overlay === 'help') closeHelp(); else if (G.overlay === 'feed') closeFeed(); else if (G.overlay === 'pause') closePause(); else openPause(); }
  else if ((k === ' ' || k === 'Enter') && G.screen === 'hatch') { e.preventDefault(); tapEgg(); }
  else if ((k === ' ' || k === 'Enter') && G.overlay === 'result') { e.preventDefault(); miniClose(); }
}
window.addEventListener('keydown', (e) => onKey(e, true));
window.addEventListener('keyup', (e) => onKey(e, false));
window.addEventListener('blur', () => { MG.keys.l = MG.keys.r = false; });
stage.addEventListener('pointerdown', (e) => {
  AU.init();
  const p = toStage(e);
  if (BATH.on && G.screen === 'room' && !G.paused) { BATH.down = true; BATH.lx = p.x; BATH.ly = p.y; bathMove(p, false); }
});
stage.addEventListener('pointermove', (e) => { if (BATH.on) bathMove(toStage(e), BATH.down && !G.paused); });
window.addEventListener('pointerup', () => { if (BATH.down) { BATH.down = false; if (W.sponge) W.sponge.play('idle', { loop: true }); } });
LAY.world.addEventListener('click', (e) => worldClick(toStage(e)));
window.addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { writeSave(); G.hiddenAt = Date.now(); }
  else if (G.hiddenAt && S && S.name && G.screen === 'room') { const away = (Date.now() - G.hiddenAt) / 1000; if (away > 5) settle(away); G.hiddenAt = 0; }
});
window.addEventListener('pagehide', writeSave);
window.addEventListener('beforeunload', writeSave);

// ============================================================ main loop
function frame(now) {
  const raw = Math.min(0.1, (now - G.lastTick) / 1000);
  G.lastTick = now;
  const dt = raw * G.timeScale;
  runTweens(raw);
  updateToast(raw);
  if (G.patCd > 0) G.patCd -= raw;
  if (G.toyCd > 0) G.toyCd -= raw;
  G.btnT = (G.btnT || 0) - raw;
  if (G.btnT <= 0) { G.btnT = 0.5; BTNS.forEach((b) => { if (b.hover && b.el.offsetParent === null) { b.hover = false; b.base(); } }); }
  if (!G.paused) {
    if (G.screen === 'room' && S) { petUpdate(raw); roomTick(dt); }
    else if (G.screen === 'mini') miniTick(raw);
    else if (G.screen === 'hatch' || G.screen === 'name' || G.screen === 'title') petUpdate(raw);
  }
  requestAnimationFrame(frame);
}

// ============================================================ test hooks
window.__pp = {
  state() {
    return { screen: G.screen, overlay: G.overlay, paused: G.paused, name: S && S.name, diff: S && S.diff, stage: S && S.stage, form: S && S.form,
      needs: S ? Object.fromEntries(NEEDS.map((n) => [n, Math.round(S.needs[n] * 10) / 10])) : null, sick: S && S.sick, angry: S && S.angry,
      sleeping: S && S.sleeping, growth: S && Math.round(S.growth * 10) / 10, day: S && S.name ? dayNum() : 0, clock: S ? clockText() : '',
      petSeg: PET.seg, petForm: PET.form, stats: S && S.stats, bath: BATH.on ? BATH.count : null, mini: MG.on ? { t: +MG.t.toFixed(1), score: MG.score } : null,
      scene: W.scene, lights: W.lightState, muted: AU.muted, audio: AU.ctx ? AU.ctx.state : 'none' };
  },
  lottie() { return Object.assign({}, LSTAT, { svgCount: document.querySelectorAll('#stage svg').length }); },
  skip(sec) { if (!S || G.screen !== 'room') return 'not in room'; let t = sec; while (t > 0) { const d = Math.min(1, t); sim(d, false); t -= d; } checkStage(); updateHUD(); return this.state(); },
  speed(k) { G.timeScale = k; return k; },
  setNeeds(o) { Object.assign(S.needs, o); updateHUD(); return this.state().needs; },
  grow(n) { S.growth += n; checkStage(); return S.growth; },
  event(name) { if (name === 'gift') { S.gift = 60; spawnGift(false); } else if (name === 'rain') startRain(); else if (name === 'nightmare') startNightmare(); return name; },
  scrub(n = 30) {
    const c = petCenter();
    const r = stage.getBoundingClientRect();
    const toClient = (x, y) => ({ clientX: r.left + x * G.scale, clientY: r.top + y * G.scale, bubbles: true, pointerId: 1 });
    stage.dispatchEvent(new PointerEvent('pointerdown', toClient(c.x - 40, c.y)));
    for (let i = 0; i < n * 3; i++) {
      const x = c.x + Math.sin(i * 0.7) * 50, y = c.y + Math.cos(i * 1.3) * 22;
      stage.dispatchEvent(new PointerEvent('pointermove', toClient(x, y)));
    }
    window.dispatchEvent(new PointerEvent('pointerup', toClient(c.x, c.y)));
    return BATH.count;
  },
  tapPet() {
    const c = petCenter(), r = stage.getBoundingClientRect();
    LAY.world.dispatchEvent(new MouseEvent('click', { clientX: r.left + c.x * G.scale, clientY: r.top + c.y * G.scale, bubbles: true }));
    return PET.seg;
  },
  forceForm(f) { S.stage = f === 'baby' || f === 'teen' ? f : 'adult'; if (FORMS[f]) S.form = f; petLoad(f); PET.busy = false; petIdle(true); updateHUD(); return f; },
  save() { writeSave(); return localStorage.getItem(SAVE_KEY) ? 'saved' : 'none'; },
  age(sec) { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); s.saved -= sec * 1000; localStorage.setItem(SAVE_KEY, JSON.stringify(s)); return 'aged'; },
};

// ============================================================ boot
async function boot() {
  loadPref();
  fit();
  await loadAssets();
  await probeAssets();
  if (LSTAT.failed.length) console.error('missing Lottie files: ' + LSTAT.failed.join(','));
  buildWorld();
  buildMini();
  buildHUD();
  buildTitle();
  buildHatch();
  buildFeedMenu();
  buildOverlays();
  buildEnding();
  $('#loading').remove();
  showTitle();
  G.lastTick = performance.now();
  requestAnimationFrame(frame);
}
boot();
})();
