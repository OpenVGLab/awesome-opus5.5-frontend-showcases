<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <title>An octopus riding a unicycle while juggling</title>
  <defs>
    <radialGradient id="tentGlow" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#6e1f48"/>
      <stop offset="1" stop-color="#240717"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#fff8d6" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="mantle" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffb0c6"/>
      <stop offset="1" stop-color="#e6517c"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d0e2e"/>
      <stop offset="0.5" stop-color="#c8163f"/>
      <stop offset="1" stop-color="#8d0e2e"/>
    </linearGradient>
  </defs>

  <!-- ===== big-top interior ===== -->
  <rect x="0" y="0" width="800" height="600" fill="url(#tentGlow)"/>
  <g fill="#ffffff" opacity="0.05">
    <path d="M 400 -60 L -440 600 L -370 600 Z"/>
    <path d="M 400 -60 L -300 600 L -230 600 Z"/>
    <path d="M 400 -60 L -160 600 L -90 600 Z"/>
    <path d="M 400 -60 L -20 600 L 50 600 Z"/>
    <path d="M 400 -60 L 120 600 L 190 600 Z"/>
    <path d="M 400 -60 L 260 600 L 330 600 Z"/>
    <path d="M 400 -60 L 400 600 L 470 600 Z"/>
    <path d="M 400 -60 L 540 600 L 610 600 Z"/>
    <path d="M 400 -60 L 680 600 L 750 600 Z"/>
    <path d="M 400 -60 L 820 600 L 890 600 Z"/>
    <path d="M 400 -60 L 960 600 L 1030 600 Z"/>
    <path d="M 400 -60 L 1100 600 L 1170 600 Z"/>
  </g>

  <!-- string of lights -->
  <path d="M 0 30 Q 200 90 400 40 Q 600 90 800 30" stroke="#1a0510" stroke-width="2" fill="none"/>
  <g>
    <circle cx="50" cy="49" r="5" fill="#ffd23f"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="65" r="5" fill="#5ee6eb"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="68" r="5" fill="#ff6f91"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="350" cy="57" r="5" fill="#9be15d"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="57" r="5" fill="#ffd23f"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="550" cy="68" r="5" fill="#5ee6eb"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="650" cy="65" r="5" fill="#ff6f91"><animate attributeName="opacity" values="1;0.35;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="49" r="5" fill="#9be15d"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ===== ring: wall, sand, spotlight pool ===== -->
  <rect x="0" y="430" width="800" height="170" fill="#1e0715"/>
  <ellipse cx="400" cy="520" rx="388" ry="84" fill="#c0392b"/>
  <ellipse cx="400" cy="520" rx="372" ry="72" fill="#d9b27a"/>
  <ellipse cx="400" cy="520" rx="372" ry="72" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <ellipse cx="400" cy="512" rx="210" ry="32" fill="#fff3c0" opacity="0.35"/>

  <!-- spotlight beam -->
  <path d="M 330 0 L 470 0 L 610 515 L 190 515 Z" fill="url(#beam)">
    <animate attributeName="opacity" values="1;0.8;1;0.9;1" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- ===== curtains and valance ===== -->
  <path d="M 0 0 L 150 0 C 128 120 104 220 62 300 C 84 380 74 480 44 600 L 0 600 Z" fill="url(#curtain)"/>
  <path d="M 40 20 C 42 120 40 220 36 300 M 90 20 C 84 120 72 220 52 296 M 34 320 C 40 420 34 520 24 600" stroke="#6e0a24" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 800 0 L 650 0 C 672 120 696 220 738 300 C 716 380 726 480 756 600 L 800 600 Z" fill="url(#curtain)"/>
  <path d="M 760 20 C 758 120 760 220 764 300 M 710 20 C 716 120 728 220 748 296 M 766 320 C 760 420 766 520 776 600" stroke="#6e0a24" stroke-width="3" fill="none" opacity="0.7"/>
  <ellipse cx="60" cy="302" rx="16" ry="9" fill="#f2c14e" stroke="#b8860b" stroke-width="2"/>
  <ellipse cx="740" cy="302" rx="16" ry="9" fill="#f2c14e" stroke="#b8860b" stroke-width="2"/>
  <path d="M 0 0 L 800 0 L 800 26 Q 780 46 760 26 Q 740 46 720 26 Q 700 46 680 26 Q 660 46 640 26 Q 620 46 600 26 Q 580 46 560 26 Q 540 46 520 26 Q 500 46 480 26 Q 460 46 440 26 Q 420 46 400 26 Q 380 46 360 26 Q 340 46 320 26 Q 300 46 280 26 Q 260 46 240 26 Q 220 46 200 26 Q 180 46 160 26 Q 140 46 120 26 Q 100 46 80 26 Q 60 46 40 26 Q 20 46 0 26 Z" fill="#c9163f"/>
  <path d="M 800 26 Q 780 46 760 26 Q 740 46 720 26 Q 700 46 680 26 Q 660 46 640 26 Q 620 46 600 26 Q 580 46 560 26 Q 540 46 520 26 Q 500 46 480 26 Q 460 46 440 26 Q 420 46 400 26 Q 380 46 360 26 Q 340 46 320 26 Q 300 46 280 26 Q 260 46 240 26 Q 220 46 200 26 Q 180 46 160 26 Q 140 46 120 26 Q 100 46 80 26 Q 60 46 40 26 Q 20 46 0 26" stroke="#f2c14e" stroke-width="3" fill="none"/>

  <!-- ===== performer: rocks back and forth on the unicycle ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-29 0;29 0;-29 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>

    <ellipse cx="400" cy="511" rx="48" ry="6" fill="#3a1a0a" opacity="0.35"/>

    <!-- far crank + pedal (behind wheel) -->
    <g transform="translate(400 455)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-30;30;-30" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
        <line x1="0" y1="0" x2="-24" y2="0" stroke="#7a808a" stroke-width="6" stroke-linecap="round"/>
        <rect x="-32" y="-3" width="16" height="6" rx="2" fill="#3d4047"/>
      </g>
    </g>

    <!-- far leg tentacle on the far pedal -->
    <g stroke="#d9567d" stroke-width="16" stroke-linecap="round" fill="none">
      <path id="legFar" d="M 385 305 C 366 350 358 420 379 467">
        <animate attributeName="d" values="M 385 305 C 366 350 358 420 379 467;M 385 305 C 366 350 358 405 379 443;M 385 305 C 366 350 358 420 379 467" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- wheel: tire, spokes, near crank + pedal -->
    <g transform="translate(400 455)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-30;30;-30" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
        <circle r="55" fill="none" stroke="#26262b" stroke-width="10"/>
        <circle r="48" fill="none" stroke="#d0d4da" stroke-width="3"/>
        <g stroke="#c3c8cf" stroke-width="1.6">
          <line x1="47" y1="0" x2="-47" y2="0"/>
          <line x1="40.7" y1="23.5" x2="-40.7" y2="-23.5"/>
          <line x1="23.5" y1="40.7" x2="-23.5" y2="-40.7"/>
          <line x1="0" y1="47" x2="0" y2="-47"/>
          <line x1="-23.5" y1="40.7" x2="23.5" y2="-40.7"/>
          <line x1="-40.7" y1="23.5" x2="40.7" y2="-23.5"/>
        </g>
        <rect x="-3" y="-54" width="6" height="8" fill="#ffd23f"/>
        <circle r="7" fill="#8a8f98"/>
        <line x1="0" y1="0" x2="24" y2="0" stroke="#b9bec6" stroke-width="6" stroke-linecap="round"/>
        <rect x="16" y="-3" width="16" height="6" rx="2" fill="#555a62"/>
      </g>
    </g>

    <!-- seat post / fork and saddle -->
    <line x1="400" y1="330" x2="400" y2="455" stroke="#2f80ed" stroke-width="9" stroke-linecap="round"/>
    <rect x="388" y="390" width="24" height="9" rx="3" fill="#1f5fbf"/>
    <circle cx="400" cy="455" r="4" fill="#e8ebef"/>
    <path d="M 366 328 C 368 316 432 314 436 324 C 438 336 370 340 366 328 Z" fill="#1f1f24"/>

    <!-- hanging curls -->
    <g stroke="#ef6a90" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M 372 310 C 360 350 345 370 352 390 C 356 400 368 396 364 386"/>
      <path d="M 428 310 C 440 350 455 370 448 390 C 444 400 432 396 436 386"/>
    </g>

    <!-- near leg tentacle on the near pedal -->
    <g stroke="#ef6a90" stroke-width="16" stroke-linecap="round" fill="none">
      <path id="legNear" d="M 415 305 C 434 350 442 420 421 443">
        <animate attributeName="d" values="M 415 305 C 434 350 442 420 421 443;M 415 305 C 434 350 442 430 421 467;M 415 305 C 434 350 442 420 421 443" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <use xlink:href="#legNear" stroke="#ffd3de" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10" fill="none"/>

    <!-- balance tentacles, waving -->
    <g stroke="#ef6a90" stroke-width="15" stroke-linecap="round" fill="none">
      <path id="balL" d="M 350 305 C 300 330 262 360 240 330 C 230 316 246 306 254 318">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
          values="M 350 305 C 300 330 262 360 240 330 C 230 316 246 306 254 318;M 350 305 C 300 340 258 340 238 312 C 230 298 248 290 254 302;M 350 305 C 300 330 262 360 240 330 C 230 316 246 306 254 318"/>
      </path>
      <path id="balR" d="M 450 305 C 500 330 538 360 560 330 C 570 316 554 306 546 318">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
          values="M 450 305 C 500 340 542 340 562 312 C 570 298 552 290 546 302;M 450 305 C 500 330 538 360 560 330 C 570 316 554 306 546 318;M 450 305 C 500 340 542 340 562 312 C 570 298 552 290 546 302"/>
      </path>
    </g>
    <use xlink:href="#balL" stroke="#ffd3de" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10" fill="none"/>
    <use xlink:href="#balR" stroke="#ffd3de" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10" fill="none"/>

    <!-- juggling tentacles: catch outside, scoop, throw inside -->
    <g stroke="#ef6a90" stroke-width="15" stroke-linecap="round" fill="none">
      <path id="jugR" d="M 445 300 C 490 320 535 290 530 244">
        <animate attributeName="d" dur="0.7s" repeatCount="indefinite"
          values="M 445 300 C 490 320 535 290 530 244;M 445 300 C 488 322 520 290 512 258;M 445 300 C 486 318 500 282 495 242;M 445 300 C 490 320 535 290 530 244"/>
      </path>
      <path id="jugL" d="M 355 300 C 310 320 265 290 270 244">
        <animate attributeName="d" dur="0.7s" begin="-0.35s" repeatCount="indefinite"
          values="M 355 300 C 310 320 265 290 270 244;M 355 300 C 312 322 280 290 288 258;M 355 300 C 314 318 300 282 305 242;M 355 300 C 310 320 265 290 270 244"/>
      </path>
    </g>
    <use xlink:href="#jugR" stroke="#ffd3de" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10" fill="none"/>
    <use xlink:href="#jugL" stroke="#ffd3de" stroke-width="4" stroke-linecap="round" stroke-dasharray="0.1 10" fill="none"/>

    <!-- mantle (head) -->
    <path d="M 400 122 C 462 122 488 175 486 228 C 484 270 462 300 440 312 L 360 312 C 338 300 316 270 314 228 C 312 175 338 122 400 122 Z" fill="url(#mantle)" stroke="#c43f68" stroke-width="2"/>
    <g fill="#d94a73" opacity="0.45">
      <ellipse cx="370" cy="160" rx="10" ry="7"/>
      <ellipse cx="428" cy="148" rx="7" ry="5"/>
      <ellipse cx="452" cy="182" rx="9" ry="6"/>
      <ellipse cx="344" cy="196" rx="6" ry="5"/>
    </g>
    <ellipse cx="380" cy="150" rx="22" ry="10" fill="#ffffff" opacity="0.25" transform="rotate(-20 380 150)"/>

    <!-- face: eyes track the balls -->
    <ellipse cx="372" cy="236" rx="17" ry="20" fill="#ffffff" stroke="#b8325a" stroke-width="1.5"/>
    <ellipse cx="428" cy="236" rx="17" ry="20" fill="#ffffff" stroke="#b8325a" stroke-width="1.5"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-4 -6;4 -7;-4 -6" dur="0.7s" repeatCount="indefinite"/>
      <circle cx="372" cy="236" r="8.5" fill="#1b1026"/>
      <circle cx="428" cy="236" r="8.5" fill="#1b1026"/>
      <circle cx="375" cy="233" r="2.6" fill="#ffffff"/>
      <circle cx="431" cy="233" r="2.6" fill="#ffffff"/>
    </g>
    <ellipse cx="350" cy="264" rx="10" ry="5" fill="#ff3d6e" opacity="0.35"/>
    <ellipse cx="450" cy="264" rx="10" ry="5" fill="#ff3d6e" opacity="0.35"/>
    <path d="M 388 272 Q 400 284 412 272" stroke="#8e2447" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="409" cy="280" rx="4" ry="5" fill="#ff4d6d"/>

    <!-- bow tie -->
    <path d="M 400 306 L 377 294 L 377 318 Z M 400 306 L 423 294 L 423 318 Z" fill="#ffd23f" stroke="#c99a12" stroke-width="1.5"/>
    <circle cx="386" cy="302" r="2" fill="#e63946"/>
    <circle cx="384" cy="311" r="2" fill="#e63946"/>
    <circle cx="414" cy="302" r="2" fill="#e63946"/>
    <circle cx="416" cy="311" r="2" fill="#e63946"/>
    <circle cx="400" cy="306" r="5" fill="#f2b705" stroke="#c99a12" stroke-width="1.5"/>

    <!-- juggling balls: 3-ball cascade -->
    <g>
      <animateMotion dur="2.1s" begin="0s" repeatCount="indefinite" path="M 495 238 C 480 10 300 10 270 240 Q 285 262 305 240 C 320 10 500 10 530 240 Q 515 262 495 238 Z"/>
      <circle r="11" fill="#3ec1d3" stroke="#1d8a99" stroke-width="1.5"/>
      <path d="M -11 0 A 11 11 0 0 0 11 0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="-4" cy="-4" r="3" fill="#ffffff" opacity="0.8"/>
    </g>
    <g>
      <animateMotion dur="2.1s" begin="-0.7s" repeatCount="indefinite" path="M 495 238 C 480 10 300 10 270 240 Q 285 262 305 240 C 320 10 500 10 530 240 Q 515 262 495 238 Z"/>
      <circle r="11" fill="#ffd23f" stroke="#c99a12" stroke-width="1.5"/>
      <path d="M -11 0 A 11 11 0 0 0 11 0" fill="none" stroke="#e63946" stroke-width="2.5"/>
      <circle cx="-4" cy="-4" r="3" fill="#ffffff" opacity="0.8"/>
    </g>
    <g>
      <animateMotion dur="2.1s" begin="-1.4s" repeatCount="indefinite" path="M 495 238 C 480 10 300 10 270 240 Q 285 262 305 240 C 320 10 500 10 530 240 Q 515 262 495 238 Z"/>
      <circle r="11" fill="#9be15d" stroke="#5f9e2c" stroke-width="1.5"/>
      <path d="M -11 0 A 11 11 0 0 0 11 0" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      <circle cx="-4" cy="-4" r="3" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>

  <!-- ===== confetti ===== -->
  <g>
    <rect x="200" y="-20" width="8" height="12" fill="#ffd23f">
      <animate attributeName="y" from="-20" to="620" dur="5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="-20" width="8" height="12" fill="#5ee6eb">
      <animate attributeName="y" from="-20" to="620" dur="6s" begin="-4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="540" y="-20" width="8" height="12" fill="#ff6f91">
      <animate attributeName="y" from="-20" to="620" dur="5.5s" begin="-2.5s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="610" y="-20" width="8" height="12" fill="#9be15d">
      <animate attributeName="y" from="-20" to="620" dur="6.5s" begin="-5s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.55s" repeatCount="indefinite"/>
    </rect>
    <rect x="170" y="-20" width="8" height="12" fill="#b28dff">
      <animate attributeName="y" from="-20" to="620" dur="7s" begin="-3.2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.65s" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="-20" width="8" height="12" fill="#ffd23f">
      <animate attributeName="y" from="-20" to="620" dur="5.8s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="590" y="-20" width="8" height="12" fill="#5ee6eb">
      <animate attributeName="y" from="-20" to="620" dur="6.2s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="230" y="-20" width="8" height="12" fill="#ff6f91">
      <animate attributeName="y" from="-20" to="620" dur="6.8s" begin="-5.6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="8;1;8" dur="0.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
